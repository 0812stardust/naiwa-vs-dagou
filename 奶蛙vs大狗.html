<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶蛙 vs 大狗 v0.55</title>
<link rel="manifest" href='data:application/manifest+json,%7B%22name%22%3A%22%E5%A5%B6%E8%9B%99vs%E5%A4%A7%E7%8B%97%22%2C%22short_name%22%3A%22%E5%A5%B6%E8%9B%99vs%E5%A4%A7%E7%8B%97%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%2F%22%7D'>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; overflow: hidden;
    background: linear-gradient(160deg, #fdfaf3 0%, #f6edda 100%); }
  #wrap { position: relative; }
  canvas { display: block; border-radius: 22px; background: #cfe6f2; width: min(96vw, calc(92vh * 1.8), 900px);
    aspect-ratio: 900 / 500; height: auto; box-shadow: 0 14px 40px rgba(90,70,40,.16); }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(253,249,240,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 22px; z-index: 10; animation: popIn .18s ease; }
  @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  .hidden { display: none !important; }
  .card { text-align: center; background: #fffdf7; border: 1px solid #f0e4cf; border-radius: 24px; padding: 16px 26px 18px;
    box-shadow: 0 10px 30px rgba(120,95,60,.10); width: 400px; max-height: 96%; overflow: hidden; color: #1a1a1a; }
  .card h1 { font-size: 30px; letter-spacing: 5px; margin: 0 0 2px; color: #1a1a1a; }
  .card h2 { font-size: 22px; letter-spacing: 3px; margin: 0 0 8px; color: #1a1a1a; }
  .sub { font-size: 14px; color: #6f6758; margin: 0 0 2px; }
  .ver { font-size: 12px; color: #a3957c; letter-spacing: 2px; margin: 0 0 8px; }
  .tips { font-size: 12px; color: #7a7262; margin: 6px 0 0; line-height: 1.6; }
  .key-hint { font-size: 12px; color: #8a7a45; margin: 4px 0 0; min-height: 15px; }
  .card button { display: block; margin: 7px auto; font-family: inherit; cursor: pointer; border: 1px solid #eadfc8;
    border-radius: 15px; font-size: 15px; color: #1a1a1a; background: #f7efdf; box-shadow: 0 4px 12px rgba(120,95,60,.08);
    transition: transform .08s ease, filter .12s ease; }
  .card button:hover { filter: brightness(1.03); }
  .card button:active { transform: scale(.97); }
  .mode-card { width: 250px; padding: 12px 0; font-weight: 600; }
  #btnStart { background: linear-gradient(135deg,#f6e6bf,#eddaa8); }
  #btnVsP2 { background: #efe6d0; }
  #btnTrain { background: #e9eedb; }
  .icon-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0 0; }
  .icon-row button { width: 44px; height: 44px; margin: 0; border-radius: 13px; font-size: 18px; background: #f4eddf; border-color: #ece1cc; }
  .small-btn { width: 170px !important; padding: 8px 0 !important; font-size: 13px !important; background: #f2ecdf !important; box-shadow: none !important; }
  #pauseBtn { position: absolute; top: 10px; left: 10px; width: 34px; height: 34px; border-radius: 12px; border: none;
    background: rgba(255,253,247,0.9); color: #1a1a1a; font-size: 15px; cursor: pointer; z-index: 5; box-shadow: 0 3px 10px rgba(120,95,60,.15); }
  #trainResetBtn { position: absolute; bottom: 10px; right: 10px; padding: 7px 14px; border-radius: 12px; border: none;
    background: rgba(255,253,247,0.9); color: #1a1a1a; font-size: 12px; cursor: pointer; z-index: 5; box-shadow: 0 3px 10px rgba(120,95,60,.15); }
  .card input[type=text] { display: block; width: 220px; margin: 11px auto; padding: 10px; font-size: 15px; font-family: inherit;
    text-align: center; border-radius: 13px; border: 2px solid #e7dcc6; background: #fbf7ee; color: #1a1a1a; outline: none; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; width: 300px; margin: 8px auto; font-size: 14px; color: #1a1a1a; }
  .stepper { display: flex; align-items: center; gap: 7px; }
  .stepper button { width: 40px; height: 37px; margin: 0; font-size: 17px; border-radius: 12px; background: #f4eddf; box-shadow: none; }
  .stepper span { min-width: 30px; font-size: 20px; font-weight: bold; color: #1a1a1a; }
  .pill { width: auto !important; min-width: 70px; padding: 8px 10px !important; margin: 0 !important; font-size: 13px !important; border-radius: 12px !important; background: #f4eddf !important; box-shadow: none !important; }
  .pill.selected { background: #e6d9bc !important; border-color: #cdb98a !important; font-weight: 600; }
  #soundToggle { width: 88px; height: 37px; padding: 0; margin: 0; font-size: 14px; }
  .range-row { display: flex; align-items: center; justify-content: space-between; width: 300px; margin: 8px auto; font-size: 14px; color: #1a1a1a; }
  .range-row input { width: 180px; accent-color: #b49a62; }
  #btnBack, #btnBack2, #btnBack3 { margin-top: 10px; }
  #keysTable { width: 320px; margin: 7px auto; border-collapse: collapse; font-size: 12px; }
  #keysTable td { border: 1px solid #eee3cd; padding: 4px; text-align: center; }
  #keysTable .action-name { text-align: left; color: #333; }
  #keysTable button { width: 100px; margin: 0; padding: 6px 0; font-size: 12px; border-radius: 10px; background: #f4eddf; box-shadow: none; }
  #keysTable button.conflict { background: #f8d7d0 !important; color: #8a2c1f !important; border-color: #e5a99d !important; }
  .stat-line { font-size: 14px; color: #1a1a1a; margin: 6px 0; }
  #charStatHint { font-size: 12px; color: #6f6758; line-height: 1.6; min-height: 18px; white-space: pre-line; }
  #pauseInfo { font-size: 13px; color: #6f6758; margin: 6px 0; }
  .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 9px 0; }
  .map-opt { border: 1px solid #eee3cd; border-radius: 16px; padding: 0; cursor: pointer; background: #fffdf7; box-shadow: 0 5px 14px rgba(120,95,60,.08); overflow: hidden; }
  .map-opt .thumb { height: 48px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #1a1a1a; }
  .map-opt .mname { padding: 6px 0 7px; font-size: 12px; color: #1a1a1a; font-weight: 600; }
  .map-opt .mtag { font-size: 10px; color: #9a8f7a; padding: 0 6px 6px; }
  .map-opt.selected { outline: 3px solid #c9b37f; }
  #btnPickMap { width: 250px; padding: 11px 0; font-size: 15px; border-radius: 15px; background: #efe6d0; }
  #touchCtrl { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #touchCtrl .tbtn { position: absolute; width: 52px; height: 52px; border-radius: 50%; border: none;
    background: rgba(255,253,247,0.7); color: #1a1a1a; font-size: 18px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none; box-shadow: 0 4px 12px rgba(120,95,60,.18); }
  #touchCtrl .tbtn:active { background: #fff; }
  .t-left { left: 14px; bottom: 70px; } .t-right { left: 82px; bottom: 70px; }
  .t-jump { left: 30px; bottom: 138px; } .t-crouch { left: 82px; bottom: 14px; }
  .t-attack { right: 82px; bottom: 70px; } .t-special { right: 14px; bottom: 70px; } .t-bomb { right: 46px; bottom: 138px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="500"></canvas>
  <button id="pauseBtn" class="hidden" title="暂停">⏸</button>
  <button id="trainResetBtn" class="hidden" title="重置木桩血量">🔄 重置木桩</button>

  <div id="touchCtrl" class="hidden">
    <button class="tbtn t-left" data-act="left">◀</button>
    <button class="tbtn t-right" data-act="right">▶</button>
    <button class="tbtn t-jump" data-act="jump">▲</button>
    <button class="tbtn t-crouch" data-act="crouch">▼</button>
    <button class="tbtn t-attack" data-act="attack">⚔</button>
    <button class="tbtn t-special" data-act="special">★</button>
    <button class="tbtn t-bomb" data-act="bomb">💣</button>
  </div>

  <!-- 登录 -->
  <div id="loginScreen" class="overlay">
    <div class="card">
      <h1>奶蛙 vs 大狗</h1>
      <p class="sub">🐸 清新格斗对战 🐶</p>
      <p class="ver">v0.55</p>
      <input id="nameInput" type="text" maxlength="12" placeholder="输入你的昵称">
      <button id="btnLogin" class="mode-card" style="background:linear-gradient(135deg,#ffd76a,#ffb75e);color:#7a5200;">进入游戏</button>
    </div>
  </div>

  <!-- 开始界面（整合模式选择） -->
  <div id="menuScreen" class="overlay hidden">
    <div class="card">
      <h1>奶蛙 vs 大狗</h1>
      <p class="sub" id="menuGreeting">欢迎！</p>
      <p class="ver">v0.55</p>
      <button id="btnStart" class="mode-card">🤖 人机对战</button>
      <button id="btnVsP2" class="mode-card">👥 双人对战</button>
      <button id="btnTrain" class="mode-card">🎯 训练模式</button>
      <div class="icon-row">
        <button id="btnSettings" title="设置">⚙</button>
        <button id="btnStats" title="成绩">🏆</button>
        <button id="btnChangeName" title="修改昵称">✏️</button>
        <button id="btnExit" title="退出">🚪</button>
      </div>
    </div>
  </div>

  <!-- 准备界面 -->
  <div id="readyScreen" class="overlay hidden">
    <div class="card">
      <h2 id="readyTitle">准 备</h2>
      <div class="setting-row"><span>🗺️ 地图</span><button id="btnPickMap">选择地图</button></div>
      <div id="charRow" class="setting-row hidden"><span>角色</span>
        <div class="stepper">
          <button id="charFrog" class="pill">🐸 奶蛙</button>
          <button id="charDog" class="pill">🐶 大狗</button>
        </div>
      </div>
      <p id="charHint" class="key-hint"></p>
      <p id="charStatHint"></p>
      <button id="btnStartBattle" class="mode-card" style="background:linear-gradient(135deg,#54e0a5,#2fc78a);">开始战斗</button>
      <button id="btnReadyBack" class="small-btn">返 回</button>
    </div>
  </div>

  <!-- 地图二级菜单 -->
  <div id="mapSelectScreen" class="overlay hidden">
    <div class="card">
      <h2>选择地图</h2>
      <div class="map-grid" id="mapGrid"></div>
      <button id="btnMapBack" class="small-btn">返 回</button>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settingsScreen" class="overlay hidden">
    <div class="card">
      <h2>设 置</h2>
      <div class="setting-row"><span>命数</span><div class="stepper"><button id="livesMinus">−</button><span id="livesValue">3</span><button id="livesPlus">＋</button></div></div>
      <div class="setting-row"><span>音效</span><button id="soundToggle" class="pill">开</button></div>
      <div class="setting-row"><span>AI 难度</span>
        <div class="stepper">
          <button id="aiEasy" class="pill">简单</button>
          <button id="aiNormal" class="pill">普通</button>
          <button id="aiHard" class="pill">困难</button>
        </div>
      </div>
      <button id="btnKeys" class="small-btn">⌨️ 键位设置</button>
      <button id="btnBack" class="small-btn">返 回</button>
    </div>
  </div>

  <!-- 键位设置 -->
  <div id="keysScreen" class="overlay hidden">
    <div class="card">
      <h2>键位设置</h2>
      <p class="key-hint" id="keyHint">点击动作后按新按键即可修改</p>
      <div id="keysTableWrap"></div>
      <button id="btnResetKeys" class="small-btn">恢复默认键位</button>
      <button id="btnBack2" class="small-btn">返 回</button>
    </div>
  </div>

  <!-- 成绩 -->
  <div id="statsScreen" class="overlay hidden">
    <div class="card">
      <h2>成 绩</h2>
      <p class="stat-line" id="statGames">对局数：0</p>
      <p class="stat-line" id="statWins">胜场：0</p>
      <p class="stat-line" id="statMaxCombo">最高连击：0</p>
      <p class="stat-line" id="statBestScore">最高单局分：0</p>
      <p class="stat-line" id="statTotalScore">总得分：0</p>
      <button id="btnResetStats" class="small-btn">清空成绩</button>
      <button id="btnBack3" class="small-btn">返 回</button>
    </div>
  </div>

  <!-- 暂停 -->
  <div id="pauseScreen" class="overlay hidden">
    <div class="card">
      <h2>暂 停</h2>
      <p id="pauseInfo"></p>
      <button id="btnResume" class="mode-card" style="background:linear-gradient(135deg,#54e0a5,#2fc78a);">继续游戏</button>
      <button id="btnFullscreen" class="small-btn">⛶ 切换全屏</button>
      <div class="range-row"><span>音乐音量</span><input id="bgmSlider" type="range" min="0" max="100" value="40"></div>
      <div class="range-row"><span>音效音量</span><input id="sfxSlider" type="range" min="0" max="100" value="80"></div>
      <button id="btnQuitBattle" class="small-btn">退 出</button>
    </div>
  </div>

  <!-- 退出确认 -->
  <div id="farewellScreen" class="overlay hidden">
    <div class="card">
      <h2>感谢游玩！</h2>
      <p style="font-size:14px;color:#8e9aab;">你可以直接关闭本页面，或返回主菜单。</p>
      <button id="btnBackMenu" class="small-btn">返回主菜单</button>
    </div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ================= 常量 ================= */
const W = 900, H = 500;
const GROUND_Y = 460;
const MAP_W = 1800;
const MARGIN = 50;
const GRAVITY = 0.45;
const BASE_JUMP = -12.25;
const ACCEL = 0.5;
const FRICTION = 0.85;
const ANIM_CYCLE = 12;
const NORMAL_ATK  = { total: 18, activeStart: 0,  activeEnd: 10, range: 60 };
const SPECIAL_ATK = { total: 26, activeStart: 7,  activeEnd: 21, range: 120 };
const RESPAWN_TIME = 60;
const RESPAWN_INVINCIBLE = 90;
const RESPAWN_GRACE = 30;
const PICKUP_W = 30, PICKUP_H = 30, PICKUP_GROUND = 480, PICKUP_LIFE = 300;
const BOMB_FUSE = 180;
const BOMB_RADIUS = 90;
const BOMB_MAX_DMG = 60;
const SHIELD_TIME = 300;
const CHAIN_TIME = 180;
const SKATE_TIME = 420;
const POWER_TIME = 480;
const COMBO_WINDOW = 240;
const AIR_JUMP_CD = 72;
const CRIT_INTERVAL = 900;    // 大狗暴击：每 15 秒一次
const CRIT_MULT = 1.5;

/* ================= 地图（含多层元素） ================= */
const MAPS = {
  grass: {
    name: '🌿 草地', speedMult: 1, theme: { skyTop: '#8fd3ff', skyBottom: '#d5f0ff', ground: '#7ecb4f', groundEdge: '#5da83a' },
    platforms: [
      { x: 220, y: 350, w: 200, h: 16 }, { x: 560, y: 260, w: 200, h: 16 },
      { x: 1000, y: 350, w: 220, h: 16 }, { x: 1380, y: 260, w: 200, h: 16 },
    ],
    boxes: [ { x: 130, y: 420, w: 50, h: 40 }, { x: 900, y: 412, w: 56, h: 48 }, { x: 1610, y: 420, w: 50, h: 40 } ],
  },
  snow: {
    name: '❄️ 雪地', speedMult: 0.8, snow: true, theme: { skyTop: '#c3cede', skyBottom: '#eef3f8', ground: '#f2f6fa', groundEdge: '#d7e2ec' },
    platforms: [
      { x: 200, y: 340, w: 200, h: 16 }, { x: 520, y: 250, w: 180, h: 16 },
      { x: 980, y: 320, w: 200, h: 16 }, { x: 1420, y: 240, w: 180, h: 16 },
    ],
    boxes: [ { x: 120, y: 420, w: 52, h: 40 }, { x: 860, y: 416, w: 44, h: 44 }, { x: 1640, y: 420, w: 52, h: 40 } ],
  },
  dusk: {
    name: '🌇 黄昏', speedMult: 1, theme: { skyTop: '#f29e5a', skyBottom: '#e7c39a', ground: '#7a9468', groundEdge: '#5a7248' },
    platforms: [
      { x: 240, y: 360, w: 200, h: 16 }, { x: 600, y: 270, w: 200, h: 16 },
      { x: 1020, y: 340, w: 200, h: 16 }, { x: 1400, y: 270, w: 200, h: 16 },
    ],
    boxes: [ { x: 140, y: 420, w: 50, h: 40 }, { x: 940, y: 410, w: 50, h: 50 }, { x: 1620, y: 420, w: 50, h: 40 } ],
  },
  night: {
    name: '🌙 夜晚', speedMult: 1, night: true, theme: { skyTop: '#141f3d', skyBottom: '#2a3f63', ground: '#2c3e50', groundEdge: '#1c2a3a' },
    platforms: [
      { x: 260, y: 330, w: 200, h: 16 }, { x: 580, y: 240, w: 200, h: 16 },
      { x: 1000, y: 330, w: 200, h: 16 }, { x: 1400, y: 240, w: 200, h: 16 },
    ],
    boxes: [ { x: 150, y: 420, w: 52, h: 40 }, { x: 900, y: 414, w: 46, h: 46 }, { x: 1600, y: 420, w: 52, h: 40 } ],
  },
};
let currentMap = 'grass';

/* 当前地图的可站立平台列表（平台 + 箱子） */
function standables() {
  const m = MAPS[currentMap];
  const list = m.platforms.map(function (p) { return { x: p.x, y: p.y, w: p.w, h: p.h, bounce: false }; });
  for (const b of m.boxes) list.push({ x: b.x, y: b.y, w: b.w, h: b.h, bounce: false });
  return list;
}

/* ================= 角色素材与差异化 ================= */
const CHAR_SPECS = {
  frog: {
    folder: 'naiwa', color: '#6ecf4a', label: '奶蛙',
    stats: { hp: 100, speedMult: 1.10, atkDmg: 8, atkCd: 33, spDmg: 22, spCd: 210, jumpMult: 1.05, trait: 'doubleJump' },
    frames: {
      '-1': { atk: 'latk', crouch: 'ld', special: 'lluf', jump: 'lskp', mv: ['lmv1', 'lmv2', 'lmv3'] },
      '1':  { atk: 'ratk', crouch: 'rd', special: 'rluf', jump: 'rskp', mv: ['rmv1', 'rmv2', 'rmv3'] },
    },
  },
  dog: {
    folder: 'dagou', color: '#ff8c00', label: '大狗',
    stats: { hp: 100, speedMult: 0.92, atkDmg: 10, atkCd: 42, spDmg: 30, spCd: 360, jumpMult: 0.95, trait: 'crit' },
    frames: {
      '-1': { atk: 'LATK', crouch: 'LD', special: 'LLAF', jump: 'LSKP', mv: ['LMV1', 'LMV2', 'LMV3'] },
      '1':  { atk: 'RATK', crouch: 'RD', special: 'RLUF', jump: 'RSKP', mv: ['RMV1', 'RMV2', 'RMV3'] },
    },
  },
};

const images = {};
let imagesLeft = 0;
for (const spec of Object.values(CHAR_SPECS)) {
  for (const side of Object.values(spec.frames)) {
    for (const file of [side.atk, side.crouch, side.special, side.jump].concat(side.mv)) {
      const key = spec.folder + '/' + file + '.png';
      if (images[key]) continue;
      imagesLeft++;
      const img = new Image();
      img.onload = img.onerror = function () { imagesLeft--; };
      img.src = key;
      images[key] = img;
    }
  }
}

/* ================= localStorage ================= */
function loadJSON(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 忽略 */ }
}
function loadNum(key, def) {
  try { const v = localStorage.getItem(key); const n = parseFloat(v); return isNaN(n) ? def : n; } catch (e) { return def; }
}

const ACTIONS = ['left', 'right', 'jump', 'crouch', 'attack', 'special', 'bomb'];
const ACTION_LABEL = { left: '左移', right: '右移', jump: '跳跃', crouch: '下蹲', attack: '普攻', special: '大招', bomb: '放置炸弹' };
const DEFAULT_BINDINGS = {
  p1: { left: 'a', right: 'd', jump: 'w', crouch: 's', attack: 'j', special: 'k', bomb: 'm' },
  p2: { left: 'arrowleft', right: 'arrowright', jump: 'arrowup', crouch: 'arrowdown', attack: '-', special: '=', bomb: '[' },
};
let bindings = loadJSON('keybindings', null);
if (!bindings || !bindings.p1 || !bindings.p2) {
  bindings = JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
  saveJSON('keybindings', bindings);
}

let settings = loadJSON('game_settings', { lives: 3, sound: true, aiDifficulty: 'normal' });
let stats = loadJSON('game_stats', { games: 0, wins: 0, maxCombo: 0, bestScore: 0, totalScore: 0 });
let sfxVolume = loadNum('sfx_volume', 80);
let bgmVolume = loadNum('bgm_volume', 40);
let playerName = '';
try { playerName = localStorage.getItem('player_name') || ''; } catch (e) { playerName = ''; }

/* ================= 界面状态 ================= */
const $ = (id) => document.getElementById(id);
let screen = 'login';
let paused = false;
let gameOver = null;
let mode = 'vsAI';
let readyMap = 'grass';
let p1Char = 'frog';
let p1 = null, p2 = null;
let frame = 0;
let matchScore = 0;
let matchCombo = 0;
let matchTime = 0;
let hitstop = 0;
let slowmo = 0;
let shake = 0;
let gameOverTimer = 0;

const OVERLAY_IDS = ['loginScreen', 'menuScreen', 'readyScreen', 'mapSelectScreen', 'settingsScreen', 'keysScreen', 'statsScreen', 'pauseScreen', 'farewellScreen'];

function showScreen(name) {
  for (const id of OVERLAY_IDS) $(id).classList.add('hidden');

  if (name === 'game') {

    $(name).classList.remove('hidden');

  screen = name;
  updateTouchCtrl();
}

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
function updateTouchCtrl() {

  $('touchCtrl').classList.toggle('hidden', !show);
}
function bindTouchButton(btn) {
  const act = btn.getAttribute('data-act');
  const down = function (e) {
    e.preventDefault();
    const b = bindings.p1[act];
    if (act === 'left' || act === 'right' || act === 'crouch') keys[b] = true;
    else keyPressed[b] = true;
  };
  const up = function () {
    const b = bindings.p1[act];
    if (act === 'left' || act === 'right' || act === 'crouch') keys[b] = false;
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('touchstart', down, { passive: false });
  btn.addEventListener('touchend', up);
  btn.addEventListener('touchcancel', up);
}
{
  const btns = document.querySelectorAll('#touchCtrl .tbtn');
  for (const b of btns) bindTouchButton(b);

/* ================= 键位设置界面 ================= */
let pendingKey = null;
function keyDisplay(k) {
  const map = { arrowleft: '←', arrowright: '→', arrowup: '↑', arrowdown: '↓', space: '空格' };
  return map[k] || (k.length === 1 ? k.toUpperCase() : k);
}
function renderKeysTable() {
  const wrap = $('keysTableWrap');
  const usage = {};
  for (const cp of ['p1', 'p2']) for (const a of ACTIONS) usage[bindings[cp][a]] = (usage[bindings[cp][a]] || 0) + 1;
  let html = '<table id="keysTable"><tr><td></td><td>P1</td><td>P2</td></tr>';
  for (const a of ACTIONS) {
    html += '<tr><td class="action-name">' + ACTION_LABEL[a] + '</td>';
    html += '<td><button data-cp="p1" data-action="' + a + '"' + (usage[bindings.p1[a]] > 1 ? ' class="conflict"' : '') + '>' + keyDisplay(bindings.p1[a]) + '</button></td>';
    html += '<td><button data-cp="p2" data-action="' + a + '"' + (usage[bindings.p2[a]] > 1 ? ' class="conflict"' : '') + '>' + keyDisplay(bindings.p2[a]) + '</button></td></tr>';
  }
  html += '</table>';
  wrap.innerHTML = html;
  const btns = wrap.querySelectorAll('button[data-cp]');
  for (const b of btns) {
    b.addEventListener('click', function () {
      pendingKey = { controls: b.getAttribute('data-cp'), action: b.getAttribute('data-action') };
      b.textContent = '按下新键…';
      $('keyHint').textContent = '正在设置 P' + (pendingKey.controls === 'p1' ? '1' : '2') + '「' + ACTION_LABEL[pendingKey.action] + '」，请按新按键…';
    });
  }
}
function isKeyUsed(k, pending) {
  for (const cp of ['p1', 'p2']) {
    for (const a of ACTIONS) {
      if (cp === pending.controls && a === pending.action) continue;
      if (bindings[cp][a] === k) return true;
    }
  }
  return false;
}
function normalizeKey(k) {
  if (k === ' ') return 'space';
  return k.toLowerCase();
}

/* ================= 全局按键 ================= */
const keys = {};
const keyPressed = {};
document.addEventListener('keydown', function (e) {
  const k = normalizeKey(e.key);
  if (screen === 'keysScreen' && pendingKey) {
    e.preventDefault();
    if (k === 'escape') {
      pendingKey = null; renderKeysTable();
      $('keyHint').textContent = '已取消修改';
      return;
    }
    if (isKeyUsed(k, pendingKey)) {
      pendingKey = null; renderKeysTable();
      $('keyHint').textContent = '该按键已被其他动作使用，请换一个';
      return;
    }
    bindings[pendingKey.controls][pendingKey.action] = k;
    saveJSON('keybindings', bindings);
    pendingKey = null; renderKeysTable();
    $('keyHint').textContent = '键位已更新';
    return;
  }
  if (k === 'space' || ['arrowleft', 'arrowright', 'arrowup', 'arrowdown'].indexOf(k) >= 0) e.preventDefault();
  initAudio();
  if (e.repeat) return;
  keyPressed[k] = true;
  keys[k] = true;
  if (screen === 'loginScreen') {
    if (k === 'enter') doLogin();
  } else if (screen === 'game') {
    if (gameOver) {
      if (k === 'r') startBattle();
      else if (k === 'm') showMenu();
    } else if (k === 'escape') {
      setPaused(!paused);
    }
  }
});
document.addEventListener('keyup', function (e) { keys[normalizeKey(e.key)] = false; });
window.addEventListener('blur', function () { for (const k in keys) keys[k] = false; });

function getFighterInput(f) {
  const b = bindings[f.controls];
  let move = 0;
  if (keys[b.left]) move -= 1;
  if (keys[b.right]) move += 1;
  return {
    move: move,
    face: move !== 0 ? move : undefined,
    jump: !!keyPressed[b.jump],
    jumpHeld: !!keys[b.jump],
    crouch: !!keys[b.crouch],
    attack: !!keyPressed[b.attack],
    special: !!keyPressed[b.special],
    bomb: !!keyPressed[b.bomb],
  };
}

    moveDir: 0,
    onGround: true,
    crouching: false,
    standY: GROUND_Y,          // 当前支撑面
    dropThrough: false,
    animTimer: 0,
    hp: spec.stats.hp, maxHp: spec.stats.hp,
    spawnDrop: false,
    inVoid: false,
    hitFlash: 0,
    lives: settings.lives, maxLives: settings.lives,
    dead: false, deadTimer: 0,
    dummy: controls === 'dummy',
    atkType: null,
    atkStart: 0,
    hitDone: false,
    released: false,
    attackCd: 0,
    specialCd: 0,
    hitstun: 0,
    invincible: 0,
    graceTimer: 0,
    shieldTimer: 0,
    skateTimer: 0,
    chainTimer: 0,
    powerTimer: 0,
    hasBomb: false,
    bombTimer: 0,
    critTimer: CRIT_INTERVAL,  // 大狗暴击倒计时
    combo: 0,
    comboTimer: 0,
    jumpsUsed: 0,
    jumpCd: 0,
    state: 'idle',
    aiState: 'idle',
    aiJumped: false,
    aiPlan: 'chase',           // chase / ladder / climb / descend / jumpUp
  };
}
function frameSet(f) { return CHAR_SPECS[f.char].frames[String(f.facing)]; }

function currentFrameName(f) {
  const s = frameSet(f);
  if (f.atkType === 'special') return s.special;
  if (f.atkType === 'normal') return s.atk;
  if (!f.onGround) return s.jump;
  if (f.crouching) return s.crouch;
  const moving = f.moveDir !== 0 && Math.abs(f.vx) > 0.2;
  if (moving) {
    f.animTimer++;
    return s.mv[Math.floor(f.animTimer / ANIM_CYCLE) % 3];
  }
  f.animTimer = 0;
  return s.mv[0];
}

function effAccel(f) {
  let a = ACCEL * f.stats.speedMult * MAPS[currentMap].speedMult;
  if (f.skateTimer > 0) a *= 2;
  return a;
}

/* ================= 攻击 ================= */
function startAttack(f, isSpecial) {
  const s = f.stats;
  if (isSpecial) {
    f.atkType = 'special';
    f.specialCd = s.spCd;
  } else {
    f.atkType = 'normal';
    f.attackCd = s.atkCd;
  }
  f.atkStart = frame;
  f.hitDone = false;
  f.released = false;
  f.crouching = false;
}
function attackBox(f, cfg) {
  const front = f.facing > 0 ? f.x + 25 : f.x - 25 - cfg.range;
  return { minX: front, maxX: front + cfg.range, minY: f.y - 105, maxY: f.y - 15 };
}
function bodyBox(f) {
  const h = f.crouching ? 60 : 110;
  return { minX: f.x - 35, maxX: f.x + 35, minY: f.y - h, maxY: f.y };
}
function overlap(a, b) {
  return a.minX <= b.maxX && a.maxX >= b.minX && a.minY <= b.maxY && a.maxY >= b.minY;
}

/* ================= 多层物理辅助 ================= */

/* ================= 角色更新（通用，含多层物理） ================= */
function updateFighter(f, input) {
  f.attackCd = Math.max(0, f.attackCd - 1);
  f.specialCd = Math.max(0, f.specialCd - 1);
  f.invincible = Math.max(0, f.invincible - 1);
  f.graceTimer = Math.max(0, f.graceTimer - 1);
  f.jumpCd = Math.max(0, f.jumpCd - 1);
  if (f.shieldTimer > 0) f.shieldTimer--;
  if (f.skateTimer > 0) f.skateTimer--;
  if (f.chainTimer > 0) f.chainTimer--;
  if (f.powerTimer > 0) f.powerTimer--;
  if (f.comboTimer > 0) { f.comboTimer--; if (f.comboTimer <= 0) f.combo = 0; }
  if (f.stats.trait === 'crit' && f.critTimer > 0) f.critTimer--;
  if (f.hitFlash > 0) f.hitFlash--;

  if (f.spawnDrop || f.inVoid) {
    input = { move: 0, jump: false, jumpHeld: false, crouch: false, attack: false, special: false, bomb: false, face: undefined };
  }

  if (f.hasBomb) {
    f.bombTimer--;
    if (f.bombTimer <= 0) { f.hasBomb = false; explode(f.x, f.y - 60); }
  }

  const attacking = !!f.atkType;
  if (attacking) {
    const cfg = f.atkType === 'normal' ? NORMAL_ATK : SPECIAL_ATK;
    const elapsed = frame - f.atkStart;
    if (elapsed >= cfg.total) f.atkType = null;
    if (f.atkType === 'special' && !f.released && elapsed >= cfg.activeStart) {
      f.released = true;
      addScreenFlash('special');
      SFX.special();
      spawnSpecialArea(f);
      shake = Math.max(shake, 0.5);
    }
  }

  if (f.hitstun > 0 || attacking) {
    f.hitstun = Math.max(0, f.hitstun - 1);
    input = { move: 0, jump: false, jumpHeld: false, crouch: false, attack: false, special: false, bomb: false, face: undefined };
  }
  if (f.chainTimer > 0) {
    input.move = 0; input.jump = false; input.special = false; input.bomb = false;
  }

  f.crouching = input.crouch && f.onGround && !attacking;

  if (input.face !== undefined) f.facing = input.face;
  else if (input.move !== 0) f.facing = input.move;

  f.moveDir = (!f.crouching && !attacking && f.chainTimer <= 0) ? input.move : 0;
  f.vx += f.moveDir * effAccel(f);
  f.x += f.vx;
  f.vx *= FRICTION;
  if (Math.abs(f.vx) < 0.05) f.vx = 0;

  /* ---- 重力与跳跃 ---- */
    f.vy += GRAVITY;
    if (input.jump && !f.crouching && !attacking && f.chainTimer <= 0) {
      if (f.onGround) {
        f.vy = BASE_JUMP * f.stats.jumpMult;
        f.onGround = false;
        f.jumpsUsed = 1;
      } else if (f.stats.trait === 'doubleJump' && f.jumpsUsed < 2 && f.jumpCd <= 0) {
        f.vy = BASE_JUMP * f.stats.jumpMult * 0.9;
        f.jumpsUsed = 2;
        f.jumpCd = AIR_JUMP_CD;
        spawnParticle(f.x, f.y - 40, '#ffffff');
      }
    }
    if (f.onGround) f.jumpsUsed = 0;

    /* 跳下平台（按住下+跳跃） */
    if (input.crouch && input.jump && f.onGround && f.standY < GROUND_Y) {
      f.dropThrough = true;
      f.onGround = false;
      f.y += 6;
      f.vy = 2;
    }
    if (f.dropThrough && f.y > f.standY + 8) f.dropThrough = false;

    /* 落地检测（地面 → 平台 → 蹦床） */
    let landed = false;
    if (f.vy >= 0 && f.y >= GROUND_Y && f.x > 0 && f.x < MAP_W) {
      f.y = GROUND_Y; f.vy = 0; f.onGround = true; f.standY = GROUND_Y; f.dropThrough = false; landed = true;
    }
    if (!landed && f.vy >= 0 && !f.dropThrough) {
      for (const pl of standables()) {
        if (f.x + 30 > pl.x && f.x - 30 < pl.x + pl.w && f.y >= pl.y && (f.y - f.vy) <= pl.y + 4) {
          f.y = pl.y; f.vy = 0; f.onGround = true; f.standY = pl.y; landed = true;
          break;
        }
      }
    }
    if (!landed) f.onGround = false;
    f.y += f.vy;
  if (f.x < -60 || f.x > MAP_W + 60) f.inVoid = true; // 进入地图两端虚空

  if (f.spawnDrop && f.onGround) {
    f.spawnDrop = false;
    f.invincible = Math.max(f.invincible, 30);
    spawnRespawnParticles(f.x, f.y - 60);
  }

  if (!attacking) {
    if (input.attack && f.attackCd === 0) startAttack(f, false);
    else if (input.special && f.specialCd === 0 && f.chainTimer <= 0) startAttack(f, true);
  }
  if (input.bomb && f.hasBomb && !f.dead) {
    bombs.push({ x: f.x, y: f.y - 60, timer: f.bombTimer });
    f.hasBomb = false; f.bombTimer = 0;
  }

  if (f.dead) f.state = 'dead';
  else if (f.hitstun > 0) f.state = 'hit';
  else if (f.atkType === 'special') f.state = 'special';
  else if (f.atkType === 'normal') f.state = 'attack';
  else if (!f.onGround) f.state = 'air';
  else if (f.crouching) f.state = 'crouch';
  else if (Math.abs(f.vx) > 0.2) f.state = 'move';
  else f.state = 'idle';
}

function updateDead(f) {
  f.deadTimer--;
  if (f.deadTimer <= 0) {
    f.dead = false;
    f.hp = f.maxHp;
    f.x = f.homeX;
    f.y = GROUND_Y;
    f.standY = GROUND_Y;
    f.vx = 0; f.vy = 0;
    f.onGround = true;
    f.crouching = false;
    f.dropThrough = false;
    f.inVoid = false;
    f.atkType = null;
    f.facing = f.homeFacing;
    f.invincible = RESPAWN_INVINCIBLE;
    f.graceTimer = RESPAWN_GRACE;
    f.shieldTimer = 0; f.skateTimer = 0; f.chainTimer = 0; f.powerTimer = 0; f.hasBomb = false;
    spawnRespawnParticles(f.x, GROUND_Y - 60);
  } else {
    // 尸体保持击飞动量，继续下落
    f.vy += GRAVITY;
    f.x += f.vx;
    f.y += f.vy;
    f.vx *= 0.95;
  }
}

/* ================= AI（可达性寻路 + 蹲防 + 难度） ================= */
const AI_PARAMS = {
  easy:   { interval: [25, 35], atkDist: 45, spMult: 0.5, dodge: 0.12, defend: 0.10 },
  normal: { interval: [12, 20], atkDist: 65, spMult: 1.0, dodge: 0.22, defend: 0.18 },
  hard:   { interval: [6, 10],  atkDist: 80, spMult: 1.6, dodge: 0.30, defend: 0.26 },
};
let aiTimer = 0;
function updateAI() {
  const e = p2, p = p1;
  const P = AI_PARAMS[settings.aiDifficulty] || AI_PARAMS.normal;
  if (e.hitstun > 0 || e.atkType || e.dead) {
    return { move: 0, jump: false, jumpHeld: false, crouch: false, attack: false, special: false, bomb: false, face: e.facing };
  }
  if (p.dead || p.graceTimer > 0) {
    return { move: 0, jump: false, jumpHeld: false, crouch: false, attack: false, special: false, bomb: false, face: e.facing };
  }
  const dx = p.x - e.x;
  const dist = Math.abs(dx);
  const dir = dx > 0 ? 1 : -1;
  const sameLayer = Math.abs(e.standY - p.standY) < 6;

  aiTimer--;
  if (aiTimer <= 0) {
    aiTimer = P.interval[0] + Math.floor(Math.random() * (P.interval[1] - P.interval[0] + 1));
    if (!sameLayer) {
      if (p.standY < e.standY - 6 && p.standY > e.standY - 190 && e.x + 40 > p.x - 100 && e.x - 40 < p.x + 100) e.aiPlan = 'jumpUp';
      else if (p.standY < e.standY - 6) e.aiPlan = 'chase';
      else e.aiPlan = 'descend';
    } else {
      e.aiPlan = 'chase';
      e.aiJumped = false;
      const r = Math.random();
      if (dist < P.atkDist) {
        if (r < 0.50) e.aiState = 'attack';
        else if (r < 0.70) e.aiState = 'jump';
        else if (r < 0.90) e.aiState = 'retreat';
        else e.aiState = 'idle';
      } else if (dist < 150) {
        if (r < 0.45) e.aiState = 'chase';
        else if (r < 0.60) e.aiState = 'idle';
        else if (r < 0.75) e.aiState = 'jump';
        else if (r < 0.90) e.aiState = 'attack';
        else e.aiState = 'retreat';
      } else {
        if (r < 0.75) e.aiState = 'chase';
        else if (r < 0.90) e.aiState = 'jump';
        else e.aiState = 'idle';
      }
    }
  }

  let move = 0, jump = false, crouch = false, attack = false, special = false;

  if (e.aiPlan === 'descend') {
    move = dir;
    if (sameLayer) e.aiPlan = 'chase';
  } else if (e.aiPlan === 'jumpUp') {
    move = dir;
    if (e.onGround && Math.random() < 0.4) jump = true;
    if (sameLayer) e.aiPlan = 'chase';
  }

  /* 同层战斗行为 */
  if (e.aiPlan === 'chase') {
    switch (e.aiState) {
      case 'attack':
        if (dist < P.atkDist && e.attackCd === 0) attack = true;
        else if (dist > 95) move = dir;
        else if (dist < 40) move = -dir;
        break;
      case 'chase':
        if (dist > 35) move = dir;
        if (dist < P.atkDist && e.attackCd === 0) attack = true;
        break;
      case 'retreat':
        if (dist < 280) move = -dir;
        break;
      case 'jump':
        if (e.onGround && !e.aiJumped) { jump = true; e.aiJumped = true; }
        if (dist > 220) move = dir;
        break;
      case 'idle':
        if (dist > 200) move = dir;
        break;
    }
    if (!attack && e.specialCd === 0 && dist < 150 && p.invincible <= 0) {
      let chance = 0.08 * P.spMult;
      if (p.hp < p.maxHp * 0.5) chance += 0.12 * P.spMult;
      if (dist < 130) chance += 0.15 * P.spMult;
      if (dist < 70) chance += 0.10 * P.spMult;
      if (Math.random() < chance) special = true;
    }
    if (p.atkType && dist < 95 && e.onGround) {
      const r = Math.random();
      if (r < P.defend) { crouch = true; attack = false; special = false; jump = false; }
      else if (r < P.defend + P.dodge) { jump = true; attack = false; special = false; }
    }
    if (p.invincible > 0 && dist < 65 && Math.random() < 0.5) attack = false;
    if (p.crouching && attack && Math.random() < (settings.aiDifficulty === 'hard' ? 0.7 : 0.4)) attack = false;
  }

  if (e.x < 90 && move === -1) move = 0;         // 靠近左侧虚空时不要继续左移
  if (e.x > MAP_W - 90 && move === 1) move = 0;  // 靠近右侧虚空时不要继续右移

  return { move: move, jump: jump, jumpHeld: jump, crouch: crouch, attack: attack, special: special, bomb: false, face: dir };
}

/* ================= 命中判定与伤害（含大狗暴击） ================= */
function resolveAttack(atk, def) {
  if (!atk.atkType || atk.hitDone || def.dead) return;
  const cfg = atk.atkType === 'normal' ? NORMAL_ATK : SPECIAL_ATK;
  const elapsed = frame - atk.atkStart;
  if (elapsed < cfg.activeStart || elapsed >= cfg.activeEnd) return;
  const ab = attackBox(atk, cfg);
  const db = bodyBox(def);
  if (overlap(ab, db)) {
    if (def.invincible > 0) return;
    atk.hitDone = true;
    let dmg = atk.atkType === 'normal' ? atk.stats.atkDmg : atk.stats.spDmg;
    if (atk.powerTimer > 0) dmg *= 2;
    let isCrit = false;
    if (atk.stats.trait === 'crit' && atk.critTimer <= 0) {
      dmg *= CRIT_MULT;
      isCrit = true;
      atk.critTimer = CRIT_INTERVAL;
      SFX.crit();
      addDamageNumber(atk.x + atk.facing * 50, atk.y - 150, '暴击！', 'banner');
    }
    const hit = applyDamage(def, dmg, { attacker: atk, isCrit: isCrit });
    if (hit) {
      atk.combo++;
      atk.comboTimer = COMBO_WINDOW;
      matchCombo = Math.max(matchCombo, atk.combo);
      if (atk.combo > 5) SFX.combo();
    }
  }
}

function applyDamage(def, dmg, opts) {
  opts = opts || {};
  if (def.dead || def.hp <= 0) return false;
  if (def.invincible > 0) return false;
  if (def.shieldTimer > 0) {
    def.shieldTimer = 0;
    SFX.defend();
    spawnShieldBreak(def.x, def.y - 70);
    addDamageNumber(def.x, def.y - 100, '🛡', 'shield');
    return false;
  }
  if (def.crouching) {
    const d = Math.max(1, Math.round(dmg * 0.2));
    def.hp = Math.max(0, def.hp - d);
    SFX.defend();
    addDamageNumber(def.x + (Math.random() * 40 - 20), def.y - 95, d, 'defend');
    spawnDeflectParticles(def.x - (opts.attacker ? opts.attacker.facing : 1) * 30, def.y - 70);
    addScore(10);
  } else {
    dmg = Math.max(1, Math.round(dmg));
    def.hp = Math.max(0, def.hp - dmg);
    SFX.hit();
    addScreenFlash('hit');
    const cls = opts.isCrit ? 'crit' : (opts.attacker ? (opts.attacker.atkType === 'special' ? 'special' : 'hit') : 'bomb');
    addDamageNumber(def.x + (Math.random() * 40 - 20), def.y - 95, dmg, cls);
    spawnHitParticles(def.x - (opts.attacker ? opts.attacker.facing : 1) * 30, def.y - 75);
    spawnImpactSparks(def.x - (opts.attacker ? opts.attacker.facing : 1) * 34, def.y - 70);
    def.hitFlash = 4; // 受击白闪
    addScore(opts.isCrit ? 20 : 10);
    hitstop = Math.max(hitstop, opts.isCrit ? 6 : (opts.attacker ? (opts.attacker.atkType === 'special' ? 4 : 2) : 4));
    shake = Math.max(shake, opts.isCrit ? 0.9 : (opts.attacker ? 0.6 : 0.8));
    if (!def.dummy) {
      def.hitstun = 12;
      def.invincible = 42;
      def.atkType = null;
    }
    const knock = opts.attacker ? opts.attacker.facing * (opts.attacker.stats.trait === 'heavyKnock' ? 2.5 : 1.5) : (opts.knock || 0);
    def.vx += knock;
  }
  if (def.hp <= 0 && !def.dummy) {
    // 击杀：目标被击飞，攻击者受后坐力
    if (opts.attacker) {
      def.vx = opts.attacker.facing * 10;
      def.vy = -8;
      opts.attacker.vx -= opts.attacker.facing * 2.5;
    }
    onDeath(def);
  }
  else if (def.hp <= 0) def.hp = 1;
  return true;
}

function applyVoidDeath(f) {
  if (f.dead) return;
  f.lives--;
  f.dead = true;
  f.deadTimer = RESPAWN_TIME;
  f.atkType = null;
  f.crouching = false;
  f.hitstun = 0;
  f.invincible = 0;
  f.shieldTimer = 0; f.skateTimer = 0; f.chainTimer = 0; f.powerTimer = 0; f.hasBomb = false;
  spawnVoidParticles(f.x, f.y);
  addScreenFlash('hit');
  addDamageNumber(f.x, f.y - 40, '坠入虚空！', 'banner');
  shake = Math.max(shake, 0.8);
  if (f.lives <= 0) checkGameOver();
}

function onDeath(f) {
  f.lives--;
  f.dead = true;
  f.deadTimer = RESPAWN_TIME;
  f.atkType = null;
  f.crouching = false;
  f.hitstun = 0;
  f.invincible = 0;
  f.shieldTimer = 0; f.skateTimer = 0; f.chainTimer = 0; f.powerTimer = 0; f.hasBomb = false;
  spawnDeathParticles(f.x, f.y - 70);
  addScreenFlash('hit');
  addDamageNumber(f.x, f.y - 140, '击倒！', 'banner');
  hitstop = Math.max(hitstop, 6);
  slowmo = 18;
  shake = Math.max(shake, 0.9);
  addScore(100);
  if (f.lives <= 0) checkGameOver();
}

function checkGameOver() {
  const p1Out = p1.lives <= 0;
  const p2Out = p2.lives <= 0;
  let next = null;
  if (p1Out && p2Out) next = 'draw';
  else if (p2Out) next = 'win';
  else if (p1Out) next = 'lose';
  if (next && next !== gameOver) {
    gameOver = next;
    gameOverTimer = 0;
    if (next === 'win') { SFX.win(); addScore(500); stats.wins++; }
    else if (next === 'lose') SFX.lose();
    else SFX.draw();
    if (mode !== 'train') {
      stats.games++;
      stats.maxCombo = Math.max(stats.maxCombo, matchCombo);
      stats.bestScore = Math.max(stats.bestScore, matchScore);
      stats.totalScore += matchScore;
      saveJSON('game_stats', stats);
    }
  }
}

/* ================= 掉落物系统 ================= */
const PICKUP_TYPES = ['bomb', 'shield', 'heart', 'health', 'chain', 'skateboard', 'power', 'coin'];
const PICKUP_INFO = {
  bomb: { color: '#e74c3c', name: '💣 炸弹' }, shield: { color: '#ffd700', name: '🛡 护盾' },
  heart: { color: '#ff4d6d', name: '❤ 红心' }, health: { color: '#2ecc71', name: '💉 血包' },
  chain: { color: '#95a5a6', name: '⛓ 锁链' }, skateboard: { color: '#4aa3ff', name: '🛹 滑板' },
  power: { color: '#e0c341', name: '⚡ 双倍' }, coin: { color: '#ffd700', name: '💰 金币' },
};
let pickup = null;
let pickupTimer = 600;
let bombs = [];
let explosions = [];

function randPickupInterval() { return 600 + Math.floor(Math.random() * 600); }
function spawnPickup() {
  pickup = {
    type: PICKUP_TYPES[Math.floor(Math.random() * PICKUP_TYPES.length)],
    x: 50 + Math.random() * (MAP_W - 100),
    y: -30, state: 'falling', life: PICKUP_LIFE,
  };
}
function pickupBox() {
  return { minX: pickup.x - PICKUP_W / 2, maxX: pickup.x + PICKUP_W / 2, minY: pickup.y - PICKUP_H, maxY: pickup.y + PICKUP_H / 2 };
}
function updatePickup() {
  if (!pickup) { pickupTimer--; if (pickupTimer <= 0) spawnPickup(); return; }
  if (pickup.state === 'falling') {
    pickup.y += 2.2;
    if (pickup.y >= PICKUP_GROUND) { pickup.y = PICKUP_GROUND; pickup.state = 'ground'; }
  } else {
    pickup.life--;
    if (pickup.life <= 0) { pickup = null; pickupTimer = randPickupInterval(); return; }
  }
  for (const f of [p1, p2]) {
    if (f.dead) continue;
    if (overlap(bodyBox(f), pickupBox())) {
      applyPickup(f, pickup.type);
      pickup = null;
      pickupTimer = randPickupInterval();
      break;
    }
  }
}
function applyPickup(f, type) {
  SFX.pickup();
  addDamageNumber(f.x, f.y - 110, PICKUP_INFO[type].name, 'pickup');
  addScore(20);
  switch (type) {
    case 'bomb': f.hasBomb = true; f.bombTimer = BOMB_FUSE; break;
    case 'shield': f.shieldTimer = SHIELD_TIME; break;
    case 'heart': f.lives = Math.min(9, f.lives + 1); f.maxLives = Math.max(f.maxLives, f.lives); break;
    case 'health': f.hp = Math.min(f.maxHp, f.hp + 30); break;
    case 'chain': f.chainTimer = CHAIN_TIME; break;
    case 'skateboard': f.skateTimer = SKATE_TIME; break;
    case 'power': f.powerTimer = POWER_TIME; break;
    case 'coin': addScore(100); break;
  }
}

/* ================= 炸弹 ================= */
function updateBombs() {
  for (let i = bombs.length - 1; i >= 0; i--) {
    bombs[i].timer--;
    if (bombs[i].timer <= 0) { const b = bombs[i]; bombs.splice(i, 1); explode(b.x, b.y); }
  }
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].life--;
    if (explosions[i].life <= 0) explosions.splice(i, 1);
  }
}
function explode(x, y) {
  explosions.push({ x: x, y: y, life: 45, maxLife: 45 });
  SFX.explosion();
  addScreenFlash('hit');
  shake = Math.max(shake, 0.8);
  for (const f of [p1, p2]) {
    if (f.dead) continue;
    const dx = Math.abs(f.x - x);
    if (dx > BOMB_RADIUS) continue;
    const bb = bodyBox(f);
    if (bb.maxY < y - 90 || bb.minY > y + 20) continue;
    let dmg = BOMB_MAX_DMG * (1 - dx / BOMB_RADIUS);
    if (!f.onGround) dmg *= 0.7;
    applyDamage(f, dmg, { knock: Math.sign(f.x - x) * 2 });
  }
}

/* ================= 特效 ================= */
const particles = [];
const damageNumbers = [];
const specialAreas = [];
const flashes = [];
function spawnParticle(x, y, color) {
  if (particles.length >= 200) return;
  const a = Math.random() * Math.PI * 2;
  const sp = 1 + Math.random() * 3.5;
  particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2, life: 22 + Math.random() * 26, maxLife: 48, size: 2 + Math.random() * 4, color: color });
}
function spawnHitParticles(x, y) {
  const colors = ['#ffd166', '#ff6b6b', '#ffffff', '#ff9f43'];
  for (let i = 0; i < 12; i++) spawnParticle(x, y, colors[(Math.random() * colors.length) | 0]);
}
function spawnDeflectParticles(x, y) { for (let i = 0; i < 8; i++) spawnParticle(x, y, '#6ec6ff'); }
function spawnShieldBreak(x, y) { for (let i = 0; i < 14; i++) spawnParticle(x, y, '#ffd700'); }
function spawnDeathParticles(x, y) {
  const colors = ['#ffd166', '#ff6b6b', '#ffffff', '#ff9f43'];
  for (let i = 0; i < 24; i++) spawnParticle(x, y, colors[(Math.random() * colors.length) | 0]);
}
function spawnRespawnParticles(x, y) {
  for (let i = 0; i < 16; i++) spawnParticle(x, y, Math.random() < 0.5 ? '#6ec6ff' : '#ffffff');
}
function spawnImpactSparks(x, y) {
  for (let i = 0; i < 10; i++) spawnParticle(x, y, Math.random() < 0.5 ? '#ffffff' : '#ffe066');
}
function spawnVoidParticles(x, y) {
  const colors = ['#6b4a8a', '#8a5a9a', '#3a2a5a', '#c9a6e0'];
  for (let i = 0; i < 26; i++) spawnParticle(x, y, colors[(Math.random() * colors.length) | 0]);
}
const DMG_COLORS = { hit: '#ff4d4d', special: '#ffd700', bomb: '#ff9f43', defend: '#7fd4ff', shield: '#ffe066', pickup: '#7dff9e', banner: '#ffd700', crit: '#ff2d78' };
function addDamageNumber(x, y, text, cls) {
  const big = cls === 'banner';
  damageNumbers.push({ x: x, y: y, vy: big ? -1.2 : -2.4, life: big ? 70 : 45, maxLife: big ? 70 : 45, text: String(text), cls: cls, big: big });
}
function addScreenFlash(type) {
  flashes.push({ type: type, life: type === 'special' ? 18 : 10, maxLife: type === 'special' ? 18 : 10 });
}
function spawnSpecialArea(f) {
  specialAreas.push({ x: f.x, facing: f.facing, y: f.y, life: 16, maxLife: 16 });
}
function updateEffects() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const n = damageNumbers[i];
    n.y += n.vy; n.vy *= 0.96;
    n.life--;
    if (n.life <= 0) damageNumbers.splice(i, 1);
  }
  for (let i = specialAreas.length - 1; i >= 0; i--) {
    specialAreas[i].life--;
    if (specialAreas[i].life <= 0) specialAreas.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].life--;
    if (flashes[i].life <= 0) flashes.splice(i, 1);
  }
}

/* ================= 视口 ================= */
let viewport = { offsetX: 0, viewWidth: 900, scale: 1 };
function updateViewport() {
  const dist = Math.abs(p1.x - p2.x);
  const viewWidth = Math.max(900, Math.min(MAP_W, dist * 1.2));
  const midX = (p1.x + p2.x) / 2;
  let offsetX = midX - viewWidth / 2;
  offsetX = Math.max(0, Math.min(MAP_W - viewWidth, offsetX));
  viewport = { offsetX: offsetX, viewWidth: viewWidth, scale: 900 / viewWidth };
}
function w2sX(x) { return (x - viewport.offsetX) * viewport.scale; }

/* ================= 计分 ================= */
function addScore(v) { if (mode === 'train') return; matchScore += v; }

/* ================= 战斗 ================= */
function startBattle() {
  if (mode === 'vsAI') {
    p1 = makeFighter('frog', 'p1', 200);
    p2 = makeFighter('dog', 'ai', 1600);
  } else if (mode === 'vsP2') {
    p1 = makeFighter(p1Char, 'p1', 200);
    p2 = makeFighter(p1Char === 'frog' ? 'dog' : 'frog', 'p2', 1600);
  } else {
    p1 = makeFighter('frog', 'p1', 200);
    p2 = makeFighter('dog', 'dummy', 1000);
    p2.hp = 999; p2.maxHp = 999; p2.lives = 999; p2.dummy = true;
    p1.lives = 999; p1.maxLives = 999;
  }
  if (!p2.dummy) {
    // 开局角色从天而降（快速落地，约 0.5 秒），落地前不可操作
    p1.y = -40; p1.vy = 10; p1.spawnDrop = true;
    p2.y = -40; p2.vy = 10; p2.spawnDrop = true;
  }
  gameOver = null;
  paused = false;
  hitstop = 0; slowmo = 0; shake = 0; gameOverTimer = 0;
  particles.length = 0;
  damageNumbers.length = 0;
  specialAreas.length = 0;
  flashes.length = 0;
  bombs.length = 0;
  explosions.length = 0;
  pickup = null;
  pickupTimer = randPickupInterval();
  frame = 0;
  aiTimer = 0;
  matchScore = 0;
  matchCombo = 0;
  matchTime = 0;
  acc = 0;
  setPaused(false);
  $('bgmSlider').value = bgmVolume;
  $('sfxSlider').value = sfxVolume;
  showScreen('game');
}
p1 = makeFighter('frog', 'p1', 200);
p2 = makeFighter('dog', 'ai', 1600);

function update() {
  frame++;
  if (screen === 'game' && !paused && !gameOver) {
    updateViewport();
    matchTime = frame / 60;
    const in1 = getFighterInput(p1);
    let in2 = null;
    if (p2.controls === 'ai') in2 = updateAI();
    else if (p2.controls === 'p2') in2 = getFighterInput(p2);
    if (p1.dead) updateDead(p1); else updateFighter(p1, in1);
    if (p2.controls === 'dummy') { /* 木桩不行动 */ }
    else if (p2.dead) updateDead(p2); else updateFighter(p2, in2);
    if (!p1.dead && p1.inVoid && p1.y > H + 100) applyVoidDeath(p1);
    if (!p2.dead && p2.inVoid && p2.y > H + 100) applyVoidDeath(p2);
    resolveAttack(p1, p2);
    resolveAttack(p2, p1);
    if (!p1.dead && !p2.dead && p2.controls !== 'dummy') pushApart();
    updatePickup();
    updateBombs();
  }
  updateEffects();
  for (const k in keyPressed) delete keyPressed[k];
}

function pushApart() {
  if (!p1.onGround || !p2.onGround) return;
  if (Math.abs(p1.standY - p2.standY) > 20) return; // 不同层不推开
  const dx = p2.x - p1.x;
  const dist = Math.abs(dx);
  if (dist >= 70 || dist === 0) return;
  const push = (70 - dist) / 2;
  const s = dx > 0 ? 1 : -1;
  p1.x = Math.max(0, Math.min(MAP_W, p1.x - s * push));
  p2.x = Math.max(0, Math.min(MAP_W, p2.x + s * push));
}

/* ================= 音效与背景音乐 ================= */
let audioCtx = null;
let bgmGain = null;
let bgmTimer = null;
const sfxPool = {};
function sfxLimit(type, fn) {
  sfxPool[type] = (sfxPool[type] || 0);
  if (sfxPool[type] >= 4) return;
  sfxPool[type]++;
  fn();
  setTimeout(function () { sfxPool[type]--; }, 140);
}
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (audioCtx && !bgmTimer) startBGM();
}
function playTone(freqStart, freqEnd, type, dur, vol, delay) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  if (!settings.sound || sfxVolume <= 0) return;
  delay = delay || 0;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(1, freqStart), t0);
  if (freqEnd && freqEnd !== freqStart) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
  const v = vol * (sfxVolume / 100);
  gain.gain.setValueAtTime(v, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}
const SFX = {
  hit:       function () { sfxLimit('hit', function () { playTone(340, 90, 'square', 0.12, 0.22); playTone(200, 60, 'triangle', 0.1, 0.15); }); },
  special:   function () { sfxLimit('special', function () { playTone(100, 700, 'sawtooth', 0.5, 0.25); }); },
  defend:    function () { sfxLimit('defend', function () { playTone(460, 300, 'sine', 0.16, 0.2); }); },
  pickup:    function () { sfxLimit('pickup', function () { playTone(660, 990, 'sine', 0.12, 0.2); }); },
  explosion: function () { sfxLimit('explosion', function () { playTone(160, 40, 'sawtooth', 0.5, 0.3); }); },
  combo:     function () { sfxLimit('combo', function () { playTone(880, 1320, 'square', 0.1, 0.18); }); },
  crit:      function () { sfxLimit('crit', function () { playTone(520, 1560, 'sawtooth', 0.25, 0.22); }); },
  bounce:    function () { sfxLimit('bounce', function () { playTone(300, 700, 'sine', 0.12, 0.2); }); },
  win:       function () { playTone(523, 523, 'square', 0.14, 0.18); playTone(659, 659, 'square', 0.14, 0.18, 0.15); playTone(784, 784, 'square', 0.28, 0.2, 0.3); },
  lose:      function () { playTone(392, 392, 'sawtooth', 0.16, 0.16); playTone(330, 330, 'sawtooth', 0.16, 0.16, 0.16); playTone(247, 247, 'sawtooth', 0.3, 0.18, 0.32); },
  draw:      function () { playTone(440, 440, 'triangle', 0.12, 0.15); playTone(440, 440, 'triangle', 0.12, 0.15, 0.14); },
};
const BGM_PATTERNS = [
  [523, 659, 784, 659, 587, 698, 880, 698],
  [392, 523, 659, 523, 440, 587, 698, 587],
];
let bgmIdx = 0;
function startBGM() {
  if (!audioCtx || bgmTimer) return;
  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = bgmVolume / 100 * 0.25;
  bgmGain.connect(audioCtx.destination);
  const pattern = BGM_PATTERNS[Math.floor(Math.random() * BGM_PATTERNS.length)];
  bgmTimer = setInterval(function () {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const freq = pattern[bgmIdx % pattern.length];
    bgmIdx++;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g);
    g.connect(bgmGain);
    o.start(t);
    o.stop(t + 0.25);
  }, 240);
}

/* ================= 主循环 ================= */
let lastTime = 0, acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (lastTime === 0) lastTime = now;
  const dt = Math.min(100, now - lastTime);
  lastTime = now;
  if (screen === 'game') {
    if (hitstop > 0) { hitstop--; draw(); }
    else if (!paused && !gameOver) {
      acc += dt * (slowmo > 0 ? 0.3 : 1);
      if (slowmo > 0) slowmo--;
      while (acc >= 16.667) { acc -= 16.667; update(); }
      draw();
    } else { draw(); }
  } else { acc = 0; }
}

/* ================= 绘制（背景装饰按世界坐标预生成） ================= */
const deco = {
  clouds: [], trees: [], flowers: [], pines: [], mountains: [], stars: [], city: [], flakes: [],
};
(function initDeco() {
  for (let i = 0; i < 5; i++) deco.clouds.push({ x: Math.random() * MAP_W, y: 50 + Math.random() * 100, s: 0.8 + Math.random() * 0.6 });
  for (let i = 0; i < 5; i++) deco.trees.push({ x: 160 + i * 380 + Math.random() * 60, y: GROUND_Y, s: 0.9 + Math.random() * 0.4 });
  for (let i = 0; i < 10; i++) deco.flowers.push({ x: Math.random() * MAP_W, y: GROUND_Y + 8 + Math.random() * 12, c: ['#f5c6d6', '#f2dfae', '#f0c7a8'][i % 3] });
  for (let i = 0; i < 4; i++) deco.mountains.push({ x: i * 480 + Math.random() * 100, w: 500 + Math.random() * 200, h: 130 + Math.random() * 70 });
  for (let i = 0; i < 4; i++) deco.pines.push({ x: 200 + i * 480 + Math.random() * 60, y: GROUND_Y, s: 0.9 + Math.random() * 0.4 });
  for (let i = 0; i < 70; i++) deco.stars.push({ x: Math.random() * MAP_W, y: Math.random() * 300, s: 1 + Math.random() * 2 });
  for (let i = 0; i < 7; i++) deco.city.push({ x: i * 260 + Math.random() * 40, w: 60 + Math.random() * 90, h: 40 + Math.random() * 70 });
  for (let i = 0; i < 26; i++) deco.flakes.push({ x: Math.random() * MAP_W, y: Math.random() * 500, sp: 0.6 + Math.random() * 1.2 });
})();

function drawBackground() {
  const map = MAPS[currentMap];
  const th = map.theme;
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, th.skyTop);
  g.addColorStop(1, th.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y);

  if (map.night) {
    // 星星 + 月亮
    ctx.fillStyle = '#fff';
    for (const s of deco.stars) {
      const sx = w2sX(s.x);
      if (sx < -5 || sx > W + 5) continue;
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(frame / 30 + s.x));
      ctx.fillRect(sx, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f5f0d0';
    ctx.beginPath(); ctx.arc(w2sX(1500), 90, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = th.skyTop;
    ctx.beginPath(); ctx.arc(w2sX(1500) - 8, 86, 18, 0, Math.PI * 2); ctx.fill();
    // 城市剪影 + 灯光
    for (const b of deco.city) {
      const sx = w2sX(b.x);
      ctx.fillStyle = 'rgba(8,14,30,0.9)';
      ctx.fillRect(sx, GROUND_Y - b.h, b.w, b.h);
      ctx.fillStyle = 'rgba(255,220,120,0.75)';
      for (let wy = 0; wy < b.h - 8; wy += 12) {
        for (let wx = 4; wx < b.w - 6; wx += 12) {
          if ((wx + wy) % 24 < 12) ctx.fillRect(sx + wx, GROUND_Y - b.h + wy + 4, 4, 5);
        }
      }
    }
    // 流星
    if (frame % 240 < 40) {
      const t = (frame % 240) / 40;
      const mx = w2sX(300 + t * 900);
      const my = 40 + t * 160;
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx - 46, my + 26); ctx.stroke();
    }
  } else if (map === MAPS.dusk) {
    // 落日 + 云霞 + 远山剪影
    const sunX = w2sX(1180), sunY = 168;
    const sg = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 90);
    sg.addColorStop(0, 'rgba(255,214,130,0.95)');
    sg.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sunX, sunY, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(120,80,110,0.55)';
    for (const m of deco.mountains) {
      const sx = w2sX(m.x);
      ctx.beginPath();
      ctx.moveTo(sx - m.w / 2, GROUND_Y);
      ctx.lineTo(sx, GROUND_Y - m.h);
      ctx.lineTo(sx + m.w / 2, GROUND_Y);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (const c of deco.clouds) {
      const sx = w2sX(c.x);
      ctx.beginPath();
      ctx.ellipse(sx, c.y, 46 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(sx + 30 * c.s, c.y + 4, 30 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    // 草地/雪地：云朵
    ctx.fillStyle = map.snow ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.75)';
    for (const c of deco.clouds) {
      const sx = w2sX(c.x);
      ctx.beginPath();
      ctx.ellipse(sx, c.y, 46 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(sx + 30 * c.s, c.y + 4, 30 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // 太阳
    ctx.fillStyle = map.snow ? '#fff7e0' : '#ffe98a';
    ctx.beginPath(); ctx.arc(w2sX(400), 70, 26, 0, Math.PI * 2); ctx.fill();
  }

  // 地面
  // 两端虚空（深色深渊）
  const vg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  vg.addColorStop(0, '#2a1a3a');
  vg.addColorStop(1, '#120a1e');
  ctx.fillStyle = vg;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  // 地面仅在地图范围内绘制
  const gx0 = w2sX(0), gx1 = w2sX(MAP_W);
  if (gx1 > 0 && gx0 < W) {
    const gLeft = Math.max(0, gx0), gRight = Math.min(W, gx1);
    ctx.fillStyle = th.ground;
    ctx.fillRect(gLeft, GROUND_Y, gRight - gLeft, H - GROUND_Y);
    ctx.fillStyle = th.groundEdge;
    ctx.fillRect(gLeft, GROUND_Y, gRight - gLeft, 5);
  }
  // 靠近地图边缘时显示虚空警示带
  if (viewport.offsetX <= 0.5) {
    const lg = ctx.createLinearGradient(0, 0, 64, 0);
    lg.addColorStop(0, 'rgba(20,10,35,0.8)');
    lg.addColorStop(1, 'rgba(20,10,35,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, 64, H);
  }
  if (viewport.offsetX >= MAP_W - viewport.viewWidth - 0.5) {
    const rg = ctx.createLinearGradient(W - 64, 0, W, 0);
    rg.addColorStop(0, 'rgba(20,10,35,0)');
    rg.addColorStop(1, 'rgba(20,10,35,0.8)');
    ctx.fillStyle = rg;
    ctx.fillRect(W - 64, 0, 64, H);
  }

  // 草地装饰（树/花）或雪地（松树/飘雪）或黄昏/夜晚（暗色植被）
  if (map.snow) {
    for (const p of deco.pines) {
      const sx = w2sX(p.x);
      ctx.fillStyle = '#e8f2f9';
      ctx.fillRect(sx - 5, GROUND_Y - 12, 10, 12);
      ctx.fillStyle = '#bfe0ef';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(sx - 26 * p.s + i * 8, GROUND_Y - 8 - i * 18);
        ctx.lineTo(sx, GROUND_Y - 52 * p.s - i * 8);
        ctx.lineTo(sx + 26 * p.s - i * 8, GROUND_Y - 8 - i * 18);
        ctx.closePath(); ctx.fill();
      }
    }
    // 飘雪
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const f of deco.flakes) {
      const fy = (f.y + frame * f.sp) % 500;
      ctx.fillRect(w2sX((f.x + Math.sin(frame / 40 + f.x) * 30 + MAP_W) % MAP_W), fy, 2.5, 2.5);
    }
  } else if (map === MAPS.grass) {
    for (const t of deco.trees) {
      const sx = w2sX(t.x);
      ctx.fillStyle = '#8a6a44';
      ctx.fillRect(sx - 5, GROUND_Y - 34 * t.s, 10, 34 * t.s);
      ctx.fillStyle = '#4e9a4e';
      ctx.beginPath();
      ctx.arc(sx, GROUND_Y - 44 * t.s, 22 * t.s, 0, Math.PI * 2);
      ctx.arc(sx - 16 * t.s, GROUND_Y - 34 * t.s, 16 * t.s, 0, Math.PI * 2);
      ctx.arc(sx + 16 * t.s, GROUND_Y - 34 * t.s, 16 * t.s, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const f of deco.flowers) {
      const sx = w2sX(f.x);
      ctx.fillStyle = f.c;
      ctx.beginPath(); ctx.arc(sx, f.y, 4, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    ctx.fillStyle = map === MAPS.dusk ? 'rgba(70,80,60,0.5)' : 'rgba(20,34,54,0.5)';
    for (const t of deco.trees) {
      const sx = w2sX(t.x);
      ctx.fillRect(sx - 4, GROUND_Y - 26 * t.s, 8, 26 * t.s);
      ctx.beginPath();
      ctx.arc(sx, GROUND_Y - 34 * t.s, 16 * t.s, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

/* 多层元素：平台/箱子/梯子/蹦床 */
function drawStructures() {
  const th = MAPS[currentMap].theme;
  const platColor = MAPS[currentMap].night ? '#5b7ba6' : '#b98a54';
  const platEdge = MAPS[currentMap].night ? '#3e5b80' : '#8a6238';
  const m = MAPS[currentMap];
  // 平台
  for (const p of m.platforms) {
    const sx = w2sX(p.x);
    ctx.fillStyle = platEdge;
    ctx.fillRect(sx, p.y, p.w * viewport.scale, p.h * viewport.scale);
    ctx.fillStyle = platColor;
    ctx.fillRect(sx, p.y, p.w * viewport.scale, (p.h - 4) * viewport.scale);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(sx, p.y, p.w * viewport.scale, 3 * viewport.scale);
  }
  // 箱子
  for (const b of m.boxes) {
    const sx = w2sX(b.x);
    ctx.fillStyle = platEdge;
    ctx.fillRect(sx, b.y, b.w * viewport.scale, b.h * viewport.scale);
    ctx.fillStyle = platColor;
    ctx.fillRect(sx + 2 * viewport.scale, b.y + 2 * viewport.scale, (b.w - 4) * viewport.scale, (b.h - 4) * viewport.scale);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 4 * viewport.scale, b.y + 4 * viewport.scale, (b.w - 8) * viewport.scale, (b.h - 8) * viewport.scale);
  }
}

function drawPickup() {
  if (!pickup) return;
  const sx = w2sX(pickup.x);
  const sy = pickup.y;
  const blink = pickup.state === 'ground' && (Math.floor(pickup.life / 15) % 2 === 0);
  if (blink) ctx.globalAlpha = 0.4;
  const info = PICKUP_INFO[pickup.type];
  ctx.fillStyle = info.color;
  ctx.fillRect(sx - PICKUP_W / 2, sy - PICKUP_H / 2, PICKUP_W, PICKUP_H);
  ctx.fillStyle = '#fff';
  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(info.name.slice(0, 1), sx, sy + 5);
  ctx.globalAlpha = 1;
}

function drawBombs() {
  for (const b of bombs) {
    const sx = w2sX(b.x);
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(sx, b.y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(sx, b.y, 9, 0, Math.PI * 2); ctx.fill();
  }
}

function drawExplosions() {
  for (const ex of explosions) {
    const t = ex.life / ex.maxLife;
    const sx = w2sX(ex.x);
    const r = BOMB_RADIUS * viewport.scale * (1.3 - t * 0.3);
    ctx.fillStyle = 'rgba(255,150,40,' + (0.6 * t).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(sx, ex.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,120,' + (0.8 * t).toFixed(3) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(sx, ex.y, r, 0, Math.PI * 2); ctx.stroke();

function drawCharacter(f) {
  const isDead = f.dead;
  if (isDead) ctx.globalAlpha = 0.6;
  const frameName = currentFrameName(f);
  const img = images[f.folder + '/' + frameName + '.png'];
  if (!isDead && f.invincible > 0 && Math.floor(f.invincible / 4) % 2 === 0) ctx.globalAlpha = 0.45;
  const sx = w2sX(f.x);
  const air = 1 - Math.max(0, Math.min(1, (GROUND_Y - f.y) / 200));
  ctx.fillStyle = 'rgba(0,0,0,' + (0.18 * air).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(sx, f.standY + 3, 34 * viewport.scale, 7 * viewport.scale, 0, 0, Math.PI * 2);
  ctx.fill();
  const cw = 100 * viewport.scale;
  const ch = 125 * viewport.scale;
  const topY = f.y - 125;
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, sx - cw / 2, topY, cw, ch);
  } else {
    ctx.fillStyle = f.color;
    ctx.fillRect(sx - cw / 2, topY, cw, ch);
  }
  // 受击白闪
  if (f.hitFlash > 0) {
    ctx.globalAlpha = 0.5 * (f.hitFlash / 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx - cw / 2, topY, cw, ch);
  }
  ctx.globalAlpha = 1;
  if (f.crouching) {
    ctx.strokeStyle = 'rgba(80,180,255,0.9)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(sx, f.y - 40, 60 * viewport.scale, 68 * viewport.scale, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (f.shieldTimer > 0) {
    ctx.fillStyle = 'rgba(255,215,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(sx, f.y - 60, 66 * viewport.scale, 78 * viewport.scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,0,0.85)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.ellipse(sx, f.y - 60, 66 * viewport.scale, 78 * viewport.scale, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (f.chainTimer > 0) {
    ctx.fillStyle = '#95a5a6';
    ctx.beginPath(); ctx.arc(sx, f.y - 135, 10 * viewport.scale, 0, Math.PI * 2); ctx.fill();
  }
  if (f.hasBomb) {
    ctx.fillStyle = '#e74c3c';
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💣', sx, f.y - 138);
  }
  if (f.skateTimer > 0) {
    ctx.fillStyle = 'rgba(74,163,255,0.85)';
    ctx.fillRect(sx - 34 * viewport.scale, f.y - 6, 68 * viewport.scale, 6 * viewport.scale);
  }
  if (f.powerTimer > 0) {
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚡', sx + 44 * viewport.scale, f.y - 130);
  }
  if (f.stats.trait === 'crit' && f.critTimer <= 0) {
    ctx.fillStyle = '#ff2d78';
    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚡暴击', sx, f.y - 145);
  }
  if (f.combo > 1) {
    ctx.font = 'bold ' + (f.combo >= 5 ? 22 : 16) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = f.combo >= 5 ? '#ffd700' : '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('x' + f.combo, sx, f.y - 155);
  }
}

function drawSpecialAreas() {
  for (let i = 0; i < specialAreas.length; i++) {
    const s = specialAreas[i];
    const t = s.life / s.maxLife;
    const sx = w2sX(s.x);

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(w2sX(p.x) - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawDamageNumbers() {
  ctx.textAlign = 'center';
  for (let i = 0; i < damageNumbers.length; i++) {
    const n = damageNumbers[i];
    ctx.globalAlpha = Math.max(0, n.life / n.maxLife);
    ctx.font = n.big ? 'bold 36px "Microsoft YaHei", sans-serif' : 'bold 22px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = DMG_COLORS[n.cls] || '#ff4d4d';
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.lineWidth = 4;
    ctx.strokeText(n.text, w2sX(n.x), n.y);
    ctx.fillText(n.text, w2sX(n.x), n.y);
  }
  ctx.globalAlpha = 1;
}

function drawFlashes() {
  for (let i = 0; i < flashes.length; i++) {
    const fl = flashes[i];
    const t = fl.life / fl.maxLife;
    if (fl.type === 'special') ctx.fillStyle = 'rgba(255,220,90,' + (0.5 * t).toFixed(3) + ')';
    else ctx.fillStyle = 'rgba(255,80,80,' + (0.32 * t).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* HUD（屏幕坐标） */
function drawHUD() {
  const barW = 320, barH = 20, top = 18;
  const p1Name = playerName || 'P1';
  const p2Name = mode === 'vsAI' ? '大狗' : (mode === 'train' ? '木桩' : 'P2');
  drawBar(72, top, barW, barH, p1.hp / p1.maxHp, p1.color, p1Name, p1.hp, p1.maxHp, p1);
  drawBar(W - 40 - barW, top, barW, barH, p2.hp / p2.maxHp, p2.color, p2Name, p2.hp, p2.maxHp, p2);
  drawLives(72, top + 30, p1, 'left');
  drawLives(W - 40 - barW, top + 30, p2, 'right');
  drawSpecialCd(72, top + 52, p1, 'left');
  drawSpecialCd(W - 40 - barW, top + 52, p2, 'right');
  drawBuffs(72, top + 74, p1, 'left');
  drawBuffs(W - 40 - barW, top + 74, p2, 'right');
  ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('得分 ' + matchScore, W / 2, top + 14);
}

function drawBar(x, y, w, h, ratio, color, name, hp, maxHp, f) {
  ratio = Math.max(0, Math.min(1, ratio));
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(x - 2, y - 2, w + 4, h + 4, 8);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 6);
  ctx.fill();
  if (ratio > 0) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w * ratio, h, 6);
    ctx.fill();
  }
  const img = images[f.folder + '/' + frameSet(f).mv[0] + '.png'];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x - 22, y + 10, 15, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, x - 36, y - 4, 28, 28);
    ctx.restore();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x - 22, y + 10, 15, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText(name, x + 2, y - 6);
  ctx.textAlign = 'right';
  ctx.fillText(hp + ' / ' + maxHp, x + w, y - 6);
}

function drawLives(x, y, f, side) {
  ctx.font = '15px serif';
  ctx.textAlign = side === 'left' ? 'left' : 'right';
  ctx.fillStyle = f.color;
  ctx.fillText('\u2665\u00D7' + f.lives, x, y);
}

function drawSpecialCd(x, y, f, side) {
  const w = 110, h = 8;
  const ready = f.specialCd <= 0;
  const ratio = ready ? 1 : 1 - f.specialCd / f.stats.spCd;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 4); ctx.fill();
  ctx.fillStyle = ready ? '#ffd700' : '#c9a227';
  ctx.beginPath(); ctx.roundRect(x, y, w * ratio, h, 4); ctx.fill();
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = side === 'left' ? 'left' : 'right';
  ctx.fillText(ready ? '大招 就绪' : '大招 ' + (f.specialCd / 60).toFixed(1) + 's', side === 'left' ? x + w + 8 : x - 8, y + 8);
}

function drawBuffs(x, y, f, side) {
  const items = [];
  if (f.shieldTimer > 0) items.push('🛡' + Math.ceil(f.shieldTimer / 60) + 's');
  if (f.chainTimer > 0) items.push('⛓' + Math.ceil(f.chainTimer / 60) + 's');
  if (f.skateTimer > 0) items.push('🛹' + Math.ceil(f.skateTimer / 60) + 's');
  if (f.powerTimer > 0) items.push('⚡' + Math.ceil(f.powerTimer / 60) + 's');
  if (f.hasBomb) items.push('💣' + Math.ceil(f.bombTimer / 60) + 's');
  if (f.stats.trait === 'crit') items.push(f.critTimer <= 0 ? '💥暴击就绪' : '💥暴击' + Math.ceil(f.critTimer / 60) + 's');
  if (items.length === 0) return;
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = side === 'left' ? 'left' : 'right';
  ctx.fillText(items.join('  '), side === 'left' ? x : x + 320, y + 8);
}

function drawHint() {
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.textAlign = 'center';
  ctx.fillText(mode === 'train' ? 'W 跳 · S 蹲 · J 攻 · K 大招 · M 炸弹 · ESC 暂停 · 右下角可重置木桩' : 'A/D 移动 · W 跳 · S 蹲防 · J 攻 · K 大招 · M 炸弹 · ESC 暂停', W / 2, H - 8);
}

function drawGameOver() {
  gameOverTimer++;
  const t = Math.min(1, gameOverTimer / 30);
  const scale = 0.6 + 0.4 * easeOutBack(t);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2 - 40);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.font = 'bold 54px "Microsoft YaHei", sans-serif';
  let text = '';
  if (gameOver === 'win') text = mode === 'vsAI' ? '胜 利 !' : (mode === 'train' ? '训练结束' : 'P1 胜利 !');
  else if (gameOver === 'lose') text = mode === 'vsAI' ? '失 败 !' : (mode === 'vsP2' ? 'P2 胜利 !' : '');
  else text = '平 局 !';
  ctx.fillStyle = gameOver === 'win' ? '#ffb75e' : (gameOver === 'lose' ? '#ff6b6b' : '#8e9aab');
  ctx.fillText(text, 0, 0);
  ctx.restore();
  if (gameOver === 'win' || gameOver === 'lose') {
    const winner = gameOver === 'win' ? p1 : p2;
    const img = images[winner.folder + '/' + frameSet(winner).mv[0] + '.png'];
    if (img && img.complete && img.naturalWidth > 0) {
      const bw = 90 * (0.8 + 0.2 * t);
      ctx.drawImage(img, W / 2 - bw / 2, H / 2 + 20, bw, bw * 1.25);
    }
  }
  ctx.font = '19px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#4a5568';
  ctx.textAlign = 'center';
  ctx.fillText('得分 ' + matchScore + '　按 R 再来一局 · 按 M 返回主菜单', W / 2, H / 2 + 170);
}
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function draw() {
  if (screen !== 'game') return;
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake * 8, (Math.random() - 0.5) * shake * 8);
    shake *= 0.88;
    if (shake < 0.02) shake = 0;
  }
  drawBackground();
  drawStructures();
  drawPickup();
  drawBombs();
  drawExplosions();
  drawSpecialAreas();
  drawCharacter(p1);
  drawCharacter(p2);
  drawParticles();
  drawDamageNumbers();
  ctx.restore();
  drawFlashes();
  drawHUD();
  drawHint();
  if (gameOver) drawGameOver();
  if (imagesLeft > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#4a5568';
    ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('加载中…', W / 2, H / 2);
  }
}

/* ================= 启动 ================= */
if (playerName) showScreen('menuScreen');
else showScreen('loginScreen');
requestAnimationFrame(loop);
</script>
</body>
</html>
