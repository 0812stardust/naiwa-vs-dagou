<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶蛙 vs 大狗 v0.3</title>
<link rel="manifest" href='data:application/manifest+json,%7B%22name%22%3A%22%E5%A5%B6%E8%9B%99vs%E5%A4%A7%E7%8B%97%22%2C%22short_name%22%3A%22%E5%A5%B6%E8%9B%99vs%E5%A4%A7%E7%8B%97%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%2F%22%7D'>
<style>
  html, body { margin: 0; height: 100%; background: #1c2b3a; display: flex; align-items: center; justify-content: center; font-family: "Microsoft YaHei", sans-serif; user-select: none; overflow: hidden; }
  #wrap { position: relative; }
  canvas { display: block; border: 4px solid #0d1b2a; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); background: #8fd3ff; width: min(96vw, calc(92vh * 1.8), 900px); aspect-ratio: 900 / 500; height: auto; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,20,30,0.85); border-radius: 10px; z-index: 10; animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .hidden { display: none !important; }
  .menu-box { text-align: center; color: #fff; width: 380px; max-height: 92%; overflow-y: auto; }
  .menu-box h1 { font-size: 40px; letter-spacing: 8px; color: #ffd700; margin: 0 0 4px; text-shadow: 0 3px 0 rgba(0,0,0,0.5); }
  .menu-box h2 { font-size: 26px; letter-spacing: 6px; color: #ffd700; margin: 0 0 12px; }
  .sub { font-size: 16px; color: rgba(255,255,255,0.9); margin: 0 0 6px; }
  .ver { font-size: 13px; color: rgba(255,255,255,0.55); letter-spacing: 3px; margin: 0 0 12px; }
  .tips { font-size: 13px; color: rgba(255,255,255,0.7); margin: 10px 0 0; }
  .key-hint { font-size: 13px; color: #ffd700; margin: 6px 0 0; min-height: 18px; }
  .menu-box button { display: block; width: 240px; margin: 9px auto; padding: 10px 0; font-size: 17px; font-family: inherit; color: #fff; background: linear-gradient(180deg,#4a9e6a,#2f7a4e); border: 2px solid #1d5135; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.35); }
  .menu-box button:hover { filter: brightness(1.12); }
  .menu-box button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  #btnStart { background: linear-gradient(180deg,#ffd700,#e0a800); border-color: #9a7200; color: #4a3200; }
  #btnVsP2 { background: linear-gradient(180deg,#7a6ae0,#5746b8); border-color: #3a2d85; }
  #btnTrain { background: linear-gradient(180deg,#3ecf8e,#1f9d68); border-color: #146b47; }
  #btnStats { background: linear-gradient(180deg,#5aa7c9,#387fa3); border-color: #235a78; }
  #btnSettings { background: linear-gradient(180deg,#3d8fd1,#2568a8); border-color: #154a7a; }
  #btnExit { background: linear-gradient(180deg,#d15050,#a03030); border-color: #701e1e; }
  .small-btn { width: 170px !important; font-size: 14px !important; padding: 8px 0 !important; background: linear-gradient(180deg,#5a6b7d,#3d4c5c) !important; border-color: #2a3542 !important; }
  #pauseBtn { position: absolute; top: 8px; left: 8px; width: 34px; height: 34px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.8); background: rgba(0,0,0,0.35); color: #fff; font-size: 16px; cursor: pointer; z-index: 5; }
  #pauseBtn:hover { background: rgba(0,0,0,0.55); }
  #trainResetBtn { position: absolute; bottom: 8px; right: 8px; padding: 6px 12px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.8); background: rgba(0,0,0,0.4); color: #fff; font-size: 13px; cursor: pointer; z-index: 5; }
  .menu-box input[type=text] { display: block; width: 220px; margin: 14px auto; padding: 10px; font-size: 17px; font-family: inherit; text-align: center; border-radius: 8px; border: 2px solid #2a6a9a; background: rgba(255,255,255,0.12); color: #fff; outline: none; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; width: 320px; margin: 11px auto; font-size: 15px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 42px; height: 40px; padding: 0; margin: 0; font-size: 18px; }
  .stepper span { min-width: 34px; font-size: 22px; font-weight: bold; color: #ffd700; }
  .map-btn { width: 104px !important; height: 40px !important; padding: 0 !important; margin: 0 !important; font-size: 14px !important; }
  .map-btn.selected { outline: 3px solid #ffd700; filter: brightness(1.2); }
  .map-btn.conflict { outline: 3px solid #ff5555; background: #a33 !important; }
  #soundToggle { width: 92px; height: 40px; padding: 0; margin: 0; font-size: 15px; }
  .range-row { display: flex; align-items: center; justify-content: space-between; width: 320px; margin: 11px auto; font-size: 15px; }
  .range-row input { width: 190px; }
  #btnBack, #btnBack2, #btnBack3 { margin-top: 14px; }
  #keysTable { width: 320px; margin: 8px auto; border-collapse: collapse; font-size: 13px; }
  #keysTable td { border: 1px solid rgba(255,255,255,0.25); padding: 5px; text-align: center; }
  #keysTable .action-name { text-align: left; color: rgba(255,255,255,0.85); }
  #keysTable button { width: 108px; margin: 0; padding: 5px 0; font-size: 13px; }
  #keysTable button.conflict { background: #b33 !important; border-color: #f66 !important; }
  .stat-line { font-size: 15px; color: rgba(255,255,255,0.9); margin: 7px 0; }
  #charStatHint { font-size: 12px; color: rgba(255,255,255,0.75); line-height: 1.6; min-height: 20px; }
  #pauseInfo { font-size: 13px; color: rgba(255,255,255,0.85); margin: 8px 0; }
  /* 触屏虚拟按键 */
  #touchCtrl { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #touchCtrl .tbtn { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.7); background: rgba(0,0,0,0.3); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; }
  #touchCtrl .tbtn:active { background: rgba(255,255,255,0.35); }
  .t-left { left: 14px; bottom: 70px; } .t-right { left: 84px; bottom: 70px; }
  .t-jump { left: 30px; bottom: 140px; } .t-crouch { left: 84px; bottom: 14px; }
  .t-attack { right: 84px; bottom: 70px; } .t-special { right: 14px; bottom: 70px; } .t-bomb { right: 48px; bottom: 140px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="500"></canvas>
  <button id="pauseBtn" class="hidden" title="暂停">⏸</button>
  <button id="trainResetBtn" class="hidden" title="重置木桩血量">🔄 重置木桩</button>

  <div id="touchCtrl" class="hidden">
    <button class="tbtn t-left" data-act="left">◀</button>
    <button class="tbtn t-right" data-act="right">▶</button>
    <button class="tbtn t-jump" data-act="jump">▲</button>
    <button class="tbtn t-crouch" data-act="crouch">▼</button>
    <button class="tbtn t-attack" data-act="attack">⚔</button>
    <button class="tbtn t-special" data-act="special">★</button>
    <button class="tbtn t-bomb" data-act="bomb">💣</button>
  </div>

  <div id="loginScreen" class="overlay">
    <div class="menu-box">
      <h1>奶蛙 vs 大狗</h1>
      <p class="sub">🐸 格斗对战 🐶</p>
      <p class="ver">v0.3</p>
      <input id="nameInput" type="text" maxlength="12" placeholder="输入你的昵称">
      <button id="btnLogin">进入游戏</button>
    </div>
  </div>

  <div id="menuScreen" class="overlay hidden">
    <div class="menu-box">
      <h1>奶蛙 vs 大狗</h1>
      <p class="sub" id="menuGreeting">欢迎！</p>
      <p class="ver">v0.3</p>
      <button id="btnStart">人机对战</button>
      <button id="btnVsP2">双人对战</button>
      <button id="btnTrain">训练模式</button>
      <button id="btnStats">成 绩</button>
      <button id="btnSettings">设 置</button>
      <button id="btnExit">退 出</button>
      <button id="btnChangeName" class="small-btn">修改昵称</button>
    </div>
  </div>

  <div id="readyScreen" class="overlay hidden">
    <div class="menu-box">
      <h2 id="readyTitle">准 备</h2>
      <div class="setting-row"><span>地图</span>
        <div class="stepper">
          <button id="mapGrass" class="map-btn">🌿 草地</button>
          <button id="mapSnow" class="map-btn">❄️ 雪地</button>
          <button id="mapDusk" class="map-btn">🌇 黄昏</button>
          <button id="mapNight" class="map-btn">🌙 夜晚</button>
        </div>
      </div>
      <div id="charRow" class="setting-row hidden">
        <span>角色</span>
        <div class="stepper">
          <button id="charFrog" class="map-btn">🐸 奶蛙</button>
          <button id="charDog" class="map-btn">🐶 大狗</button>
        </div>
      </div>
      <p id="charHint" class="key-hint"></p>
      <p id="charStatHint"></p>
      <button id="btnStartBattle">开始战斗</button>
      <button id="btnReadyBack" class="small-btn">返 回</button>
    </div>
  </div>

  <div id="settingsScreen" class="overlay hidden">
    <div class="menu-box">
      <h2>设 置</h2>
      <div class="setting-row"><span>命数</span><div class="stepper"><button id="livesMinus">−</button><span id="livesValue">3</span><button id="livesPlus">＋</button></div></div>
      <div class="setting-row"><span>音效</span><button id="soundToggle">开</button></div>
      <div class="setting-row"><span>AI 难度</span>
        <div class="stepper">
          <button id="aiEasy" class="map-btn">简单</button>
          <button id="aiNormal" class="map-btn">普通</button>
          <button id="aiHard" class="map-btn">困难</button>
        </div>
      </div>
      <button id="btnKeys">键位设置</button>
      <button id="btnBack" class="small-btn">返 回</button>
    </div>
  </div>

  <div id="keysScreen" class="overlay hidden">
    <div class="menu-box">
      <h2>键位设置</h2>
      <p class="key-hint" id="keyHint">点击某个动作，再按下新按键即可修改</p>
      <div id="keysTableWrap"></div>
      <button id="btnResetKeys" class="small-btn">恢复默认键位</button>
      <button id="btnBack2" class="small-btn">返 回</button>
    </div>
  </div>

  <div id="statsScreen" class="overlay hidden">
    <div class="menu-box">
      <h2>成 绩</h2>
      <p class="stat-line" id="statGames">对局数：0</p>
      <p class="stat-line" id="statWins">胜场：0</p>
      <p class="stat-line" id="statMaxCombo">最高连击：0</p>
      <p class="stat-line" id="statBestScore">最高单局分：0</p>
      <p class="stat-line" id="statTotalScore">总得分：0</p>
      <button id="btnResetStats" class="small-btn">清空成绩</button>
      <button id="btnBack3" class="small-btn">返 回</button>
    </div>
  </div>

  <div id="pauseScreen" class="overlay hidden">
    <div class="menu-box">
      <h2>暂 停</h2>
      <p id="pauseInfo"></p>
      <button id="btnResume">继续游戏</button>
      <button id="btnFullscreen">切换全屏</button>
      <div class="range-row"><span>音乐音量</span><input id="bgmSlider" type="range" min="0" max="100" value="40"></div>
      <div class="range-row"><span>音效音量</span><input id="sfxSlider" type="range" min="0" max="100" value="80"></div>
      <button id="btnQuitBattle" class="small-btn">退 出</button>
    </div>
  </div>

  <div id="farewellScreen" class="overlay hidden">
    <div class="menu-box">
      <h2>感谢游玩！</h2>
      <p style="font-size:15px;color:rgba(255,255,255,0.85);">你可以直接关闭本页面，或返回主菜单。</p>
      <button id="btnBackMenu" class="small-btn">返回主菜单</button>
    </div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ================= 常量 ================= */
const W = 900, H = 500;
const GROUND_Y = 460;
const MAP_W = 1800;
const MARGIN = 50;
const GRAVITY = 0.45;
const BASE_JUMP = -12.25;
const ACCEL = 0.5;
const FRICTION = 0.85;
const ANIM_CYCLE = 12;
const NORMAL_ATK  = { total: 18, activeStart: 0,  activeEnd: 10, range: 60 };
const SPECIAL_ATK = { total: 26, activeStart: 7,  activeEnd: 21, range: 120 };
const RESPAWN_TIME = 60;
const RESPAWN_INVINCIBLE = 90;
const RESPAWN_GRACE = 30;      // 重生后 AI 不主动出招帧数
const PICKUP_W = 30, PICKUP_H = 30, PICKUP_GROUND = 480, PICKUP_LIFE = 300;
const BOMB_FUSE = 180;
const BOMB_RADIUS = 90;
const BOMB_MAX_DMG = 60;
const SHIELD_TIME = 300;
const CHAIN_TIME = 180;
const SKATE_TIME = 420;
const POWER_TIME = 480;        // ⚡双倍伤害 8 秒
const COMBO_WINDOW = 240;      // 连击窗口 4 秒
const AIR_JUMP_CD = 72;        // 二段跳冷却 1.2 秒
const MAX_HP_LIMIT = 150;

/* ================= 地图 ================= */
const MAPS = {
  grass: { name: '🌿 草地', skyTop: '#8fd3ff', skyBottom: '#d5f0ff', ground: '#7ecb4f', groundEdge: '#5da83a', tuft: '#4f9a2f', speedMult: 1 },
  snow:  { name: '❄️ 雪地', skyTop: '#c3cede', skyBottom: '#eef3f8', ground: '#f2f6fa', groundEdge: '#d7e2ec', tuft: '#ffffff', snow: true, speedMult: 0.8 },
  dusk:  { name: '🌇 黄昏', skyTop: '#f29e5a', skyBottom: '#e7c39a', ground: '#7a9468', groundEdge: '#5a7248', tuft: '#476039', speedMult: 1 },
  night: { name: '🌙 夜晚', skyTop: '#141f3d', skyBottom: '#2a3f63', ground: '#2c3e50', groundEdge: '#1c2a3a', tuft: '#46688a', night: true, speedMult: 1 },
};
let currentMap = 'grass';

/* ================= 角色素材与差异化属性 ================= */
const CHAR_SPECS = {
  frog: {
    folder: 'naiwa', color: '#6ecf4a', label: '奶蛙',
    stats: { hp: 100, speedMult: 1.10, atkDmg: 8, atkCd: 33, spDmg: 22, spCd: 210, jumpMult: 1.05, trait: 'doubleJump' },
    frames: {
      '-1': { atk: 'latk', crouch: 'ld', special: 'lluf', jump: 'lskp', mv: ['lmv1', 'lmv2', 'lmv3'] },
      '1':  { atk: 'ratk', crouch: 'rd', special: 'rluf', jump: 'rskp', mv: ['rmv1', 'rmv2', 'rmv3'] },
    },
  },
  dog: {
    folder: 'dagou', color: '#ff8c00', label: '大狗',
    stats: { hp: 120, speedMult: 0.92, atkDmg: 10, atkCd: 42, spDmg: 30, spCd: 360, jumpMult: 0.95, trait: 'heavyKnock' },
    frames: {
      '-1': { atk: 'LATK', crouch: 'LD', special: 'LLAF', jump: 'LSKP', mv: ['LMV1', 'LMV2', 'LMV3'] },
      '1':  { atk: 'RATK', crouch: 'RD', special: 'RLUF', jump: 'RSKP', mv: ['RMV1', 'RMV2', 'RMV3'] },
    },
  },
};

const images = {};
let imagesLeft = 0;
for (const spec of Object.values(CHAR_SPECS)) {
  for (const side of Object.values(spec.frames)) {
    for (const file of [side.atk, side.crouch, side.special, side.jump].concat(side.mv)) {
      const key = spec.folder + '/' + file + '.png';
      if (images[key]) continue;
      imagesLeft++;
      const img = new Image();
      img.onload = img.onerror = function () { imagesLeft--; };
      img.src = key;
      images[key] = img;
    }
  }
}

/* ================= localStorage ================= */
function loadJSON(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 忽略 */ }
}
function loadNum(key, def) {
  try { const v = localStorage.getItem(key); const n = parseFloat(v); return isNaN(n) ? def : n; } catch (e) { return def; }
}

const ACTIONS = ['left', 'right', 'jump', 'crouch', 'attack', 'special', 'bomb'];
const ACTION_LABEL = { left: '左移', right: '右移', jump: '跳跃', crouch: '下蹲', attack: '普攻', special: '大招', bomb: '放置炸弹' };
const DEFAULT_BINDINGS = {
  p1: { left: 'a', right: 'd', jump: 'w', crouch: 's', attack: 'j', special: 'k', bomb: 'm' },
  p2: { left: 'arrowleft', right: 'arrowright', jump: 'arrowup', crouch: 'arrowdown', attack: '-', special: '=', bomb: '[' },
};
let bindings = loadJSON('keybindings', null);
if (!bindings || !bindings.p1 || !bindings.p2) {
  bindings = JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
  saveJSON('keybindings', bindings);
}

let settings = loadJSON('game_settings', { lives: 3, sound: true, aiDifficulty: 'normal' });
let stats = loadJSON('game_stats', { games: 0, wins: 0, maxCombo: 0, bestScore: 0, totalScore: 0 });
let sfxVolume = loadNum('sfx_volume', 80);
let bgmVolume = loadNum('bgm_volume', 40);
let playerName = '';
try { playerName = localStorage.getItem('player_name') || ''; } catch (e) { playerName = ''; }

/* ================= 界面状态 ================= */
const $ = (id) => document.getElementById(id);
let screen = 'login';
let paused = false;
let gameOver = null;
let mode = 'vsAI';          // vsAI / vsP2 / train
let readyMap = 'grass';
let p1Char = 'frog';
let p1 = null, p2 = null;
let frame = 0;
let matchScore = 0;
let matchCombo = 0;         // 本局最高连击（用于统计）
let matchTime = 0;          // 对局秒数
let hitstop = 0;            // 顿帧
let slowmo = 0;             // 慢动作帧
let shake = 0;              // 屏幕震动
let gameOverTimer = 0;      // 结算动画计时

const OVERLAY_IDS = ['loginScreen', 'menuScreen', 'readyScreen', 'settingsScreen', 'keysScreen', 'statsScreen', 'pauseScreen', 'farewellScreen'];

function showScreen(name) {
  for (const id of OVERLAY_IDS) $(id).classList.add('hidden');
  $('pauseBtn').classList.add('hidden');
  $('trainResetBtn').classList.add('hidden');
  if (name === 'game') {
    $('pauseBtn').classList.remove('hidden');
    if (mode === 'train') $('trainResetBtn').classList.remove('hidden');
  } else if (name !== 'none') {
    $(name).classList.remove('hidden');
  }
  screen = name;
  updateTouchCtrl();
}
function setPaused(v) {
  paused = v;
  $('pauseBtn').classList.toggle('hidden', v);
  $('pauseScreen').classList.toggle('hidden', !v);
  if (v) refreshPauseInfo();
  updateTouchCtrl();
}

/* ================= 触屏虚拟按键（仅人机/训练模式 P1） ================= */
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
function updateTouchCtrl() {
  const show = isTouchDevice && screen === 'game' && mode !== 'vsP2';
  $('touchCtrl').classList.toggle('hidden', !show);
}
function bindTouchButton(btn) {
  const act = btn.getAttribute('data-act');
  const down = function (e) {
    e.preventDefault();
    const b = bindings.p1[act];
    if (act === 'left' || act === 'right' || act === 'crouch') keys[b] = true;
    else keyPressed[b] = true;
  };
  const up = function () {
    const b = bindings.p1[act];
    if (act === 'left' || act === 'right' || act === 'crouch') keys[b] = false;
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('touchstart', down, { passive: false });
  btn.addEventListener('touchend', up);
  btn.addEventListener('touchcancel', up);
}
{
  const btns = document.querySelectorAll('#touchCtrl .tbtn');
  for (const b of btns) bindTouchButton(b);
}

/* ================= 界面逻辑 ================= */
function doLogin() {
  const v = $('nameInput').value.trim();
  playerName = v || '玩家';
  try { localStorage.setItem('player_name', playerName); } catch (e) { /* 忽略 */ }
  showMenu();
}
function showMenu() {
  $('menuGreeting').textContent = '欢迎，' + playerName + '！ 🐸 VS 🐶';
  showScreen('menuScreen');
}
function showReady() {
  $('readyTitle').textContent = mode === 'vsAI' ? '人机对战 · 准备' : (mode === 'vsP2' ? '双人对战 · 准备' : '训练模式 · 准备');
  $('charRow').classList.toggle('hidden', mode !== 'vsP2');
  p1Char = 'frog';
  updateReadyUI();
  showScreen('readyScreen');
}
function charStatText(ch) {
  const s = CHAR_SPECS[ch].stats;
  let t = '速度 ' + (s.speedMult >= 1 ? '+' : '') + Math.round((s.speedMult - 1) * 100) + '%　血量 ' + s.hp + '　普攻 ' + s.atkDmg + '　大招 ' + s.spDmg;
  if (s.trait === 'doubleJump') t += '　特性：空中二段跳';
  if (s.trait === 'heavyKnock') t += '　特性：攻击击退强化';
  return t;
}
function updateReadyUI() {
  $('mapGrass').classList.toggle('selected', readyMap === 'grass');
  $('mapSnow').classList.toggle('selected', readyMap === 'snow');
  $('mapDusk').classList.toggle('selected', readyMap === 'dusk');
  $('mapNight').classList.toggle('selected', readyMap === 'night');

/* ================= 键位设置界面 ================= */
let pendingKey = null;
function keyDisplay(k) {
  const map = { arrowleft: '←', arrowright: '→', arrowup: '↑', arrowdown: '↓', space: '空格' };
  return map[k] || (k.length === 1 ? k.toUpperCase() : k);
}
function renderKeysTable() {
  const wrap = $('keysTableWrap');
  // 统计每个按键被占用的次数，用于冲突高亮
  const usage = {};
  for (const cp of ['p1', 'p2']) for (const a of ACTIONS) usage[bindings[cp][a]] = (usage[bindings[cp][a]] || 0) + 1;
  let html = '<table id="keysTable"><tr><td></td><td>P1</td><td>P2</td></tr>';
  for (const a of ACTIONS) {
    html += '<tr><td class="action-name">' + ACTION_LABEL[a] + '</td>';
    html += '<td><button data-cp="p1" data-action="' + a + '"' + (usage[bindings.p1[a]] > 1 ? ' class="conflict"' : '') + '>' + keyDisplay(bindings.p1[a]) + '</button></td>';
    html += '<td><button data-cp="p2" data-action="' + a + '"' + (usage[bindings.p2[a]] > 1 ? ' class="conflict"' : '') + '>' + keyDisplay(bindings.p2[a]) + '</button></td></tr>';
  }
  html += '</table>';
  wrap.innerHTML = html;
  const btns = wrap.querySelectorAll('button[data-cp]');
  for (const b of btns) {
    b.addEventListener('click', function () {
      pendingKey = { controls: b.getAttribute('data-cp'), action: b.getAttribute('data-action') };
      b.textContent = '按下新键…';
      $('keyHint').textContent = '正在设置 P' + (pendingKey.controls === 'p1' ? '1' : '2') + '「' + ACTION_LABEL[pendingKey.action] + '」，请按新按键…';
    });
  }
}
function isKeyUsed(k, pending) {
  for (const cp of ['p1', 'p2']) {
    for (const a of ACTIONS) {
      if (cp === pending.controls && a === pending.action) continue;
      if (bindings[cp][a] === k) return true;
    }
  }
  return false;
}
function normalizeKey(k) {
  if (k === ' ') return 'space';
  return k.toLowerCase();
}

/* ================= 全局按键 ================= */
const keys = {};
const keyPressed = {};
document.addEventListener('keydown', function (e) {
  const k = normalizeKey(e.key);
  if (screen === 'keysScreen' && pendingKey) {
    e.preventDefault();
    if (k === 'escape') {
      pendingKey = null; renderKeysTable();
      $('keyHint').textContent = '已取消修改';
      return;
    }
    if (isKeyUsed(k, pendingKey)) {
      pendingKey = null; renderKeysTable();
      $('keyHint').textContent = '该按键已被其他动作使用，请换一个';
      return;
    }
    bindings[pendingKey.controls][pendingKey.action] = k;
    saveJSON('keybindings', bindings);
    pendingKey = null; renderKeysTable();
    $('keyHint').textContent = '键位已更新';
    return;
  }
  if (k === 'space' || ['arrowleft', 'arrowright', 'arrowup', 'arrowdown'].indexOf(k) >= 0) e.preventDefault();
  initAudio();
  if (e.repeat) return;
  keyPressed[k] = true;
  keys[k] = true;
  if (screen === 'loginScreen') {
    if (k === 'enter') doLogin();
  } else if (screen === 'game') {
    if (gameOver) {
      if (k === 'r') startBattle();
      else if (k === 'm') showMenu();
    } else if (k === 'escape') {
      setPaused(!paused);
    }
  }
});
document.addEventListener('keyup', function (e) { keys[normalizeKey(e.key)] = false; });
window.addEventListener('blur', function () { for (const k in keys) keys[k] = false; });

function getFighterInput(f) {
  const b = bindings[f.controls];
  let move = 0;
  if (keys[b.left]) move -= 1;
  if (keys[b.right]) move += 1;
  return {
    move: move,
    face: move !== 0 ? move : undefined,
    jump: !!keyPressed[b.jump],
    crouch: !!keys[b.crouch],
    attack: !!keyPressed[b.attack],
    special: !!keyPressed[b.special],
    bomb: !!keyPressed[b.bomb],
  };
}

/* ================= Fighter ================= */
function makeFighter(char, controls, x) {
  const spec = CHAR_SPECS[char];
  const hp = spec.stats.hp;
  return {
    char: char,
    controls: controls,          // 'p1' / 'p2' / 'ai' / 'dummy'
    folder: spec.folder,
    color: spec.color,
    label: spec.label,
    stats: spec.stats,
    x: x, y: GROUND_Y,
    homeX: x,
    homeFacing: x < MAP_W / 2 ? 1 : -1,
    vx: 0, vy: 0,
    facing: x < MAP_W / 2 ? 1 : -1,
    moveDir: 0,
    onGround: true,
    crouching: false,
    animTimer: 0,
    hp: hp, maxHp: hp,
    lives: settings.lives, maxLives: settings.lives,
    dead: false, deadTimer: 0,
    dummy: controls === 'dummy',
    atkType: null,
    atkStart: 0,
    hitDone: false,
    released: false,
    attackCd: 0,
    specialCd: 0,
    hitstun: 0,
    invincible: 0,
    graceTimer: 0,
    shieldTimer: 0,
    skateTimer: 0,
    chainTimer: 0,
    powerTimer: 0,
    hasBomb: false,
    bombTimer: 0,
    combo: 0,
    comboTimer: 0,
    jumpsUsed: 0,
    jumpCd: 0,
    state: 'idle',
    aiState: 'idle',
    aiJumped: false,
  };
}
function frameSet(f) { return CHAR_SPECS[f.char].frames[String(f.facing)]; }

function currentFrameName(f) {
  const s = frameSet(f);
  if (f.atkType === 'special') return s.special;
  if (f.atkType === 'normal') return s.atk;
  if (!f.onGround) return s.jump;
  if (f.crouching) return s.crouch;
  const moving = f.moveDir !== 0 && Math.abs(f.vx) > 0.2;
  if (moving) {
    f.animTimer++;
    return s.mv[Math.floor(f.animTimer / ANIM_CYCLE) % 3];
  }
  f.animTimer = 0;
  return s.mv[0];
}

/* 有效水平加速度：基础 × 角色 × 地图 × 滑板 */
function effAccel(f) {
  let a = ACCEL * f.stats.speedMult * MAPS[currentMap].speedMult;
  if (f.skateTimer > 0) a *= 2;
  return a;
}

/* ================= 攻击 ================= */
function startAttack(f, isSpecial) {
  const s = f.stats;
  if (isSpecial) {
    f.atkType = 'special';
    f.specialCd = s.spCd;
  } else {
    f.atkType = 'normal';
    f.attackCd = s.atkCd;
  }
  f.atkStart = frame;
  f.hitDone = false;
  f.released = false;
  f.crouching = false;
}
function attackBox(f, cfg) {
  const front = f.facing > 0 ? f.x + 25 : f.x - 25 - cfg.range;
  return { minX: front, maxX: front + cfg.range, minY: f.y - 105, maxY: f.y - 15 };
}
function bodyBox(f) {
  const h = f.crouching ? 60 : 110;
  return { minX: f.x - 35, maxX: f.x + 35, minY: f.y - h, maxY: f.y };
}
function overlap(a, b) {
  return a.minX <= b.maxX && a.maxX >= b.minX && a.minY <= b.maxY && a.maxY >= b.minY;
}

/* ================= 角色更新（通用） ================= */
function updateFighter(f, input) {
  f.attackCd = Math.max(0, f.attackCd - 1);
  f.specialCd = Math.max(0, f.specialCd - 1);
  f.invincible = Math.max(0, f.invincible - 1);
  f.graceTimer = Math.max(0, f.graceTimer - 1);
  f.jumpCd = Math.max(0, f.jumpCd - 1);
  if (f.shieldTimer > 0) f.shieldTimer--;
  if (f.skateTimer > 0) f.skateTimer--;
  if (f.chainTimer > 0) f.chainTimer--;
  if (f.powerTimer > 0) f.powerTimer--;
  if (f.comboTimer > 0) { f.comboTimer--; if (f.comboTimer <= 0) f.combo = 0; }

  if (f.hasBomb) {
    f.bombTimer--;
    if (f.bombTimer <= 0) {
      f.hasBomb = false;
      explode(f.x, f.y - 60);
    }
  }

  const attacking = !!f.atkType;
  if (attacking) {
    const cfg = f.atkType === 'normal' ? NORMAL_ATK : SPECIAL_ATK;
    const elapsed = frame - f.atkStart;
    if (elapsed >= cfg.total) f.atkType = null;
    if (f.atkType === 'special' && !f.released && elapsed >= cfg.activeStart) {
      f.released = true;
      addScreenFlash('special');
      SFX.special();
      spawnSpecialArea(f);
      shake = Math.max(shake, 0.5);
    }
  }

  if (f.hitstun > 0 || attacking) {
    f.hitstun = Math.max(0, f.hitstun - 1);
    input = { move: 0, jump: false, crouch: false, attack: false, special: false, bomb: false, face: undefined };
  }

  // 锁链：禁移动/跳跃/大招/放炸弹，允许下蹲与普攻
  if (f.chainTimer > 0) {
    input.move = 0;
    input.jump = false;
    input.special = false;
    input.bomb = false;
  }

  f.crouching = input.crouch && f.onGround && !attacking;

  if (input.face !== undefined) f.facing = input.face;
  else if (input.move !== 0) f.facing = input.move;

  f.moveDir = (!f.crouching && !attacking && f.chainTimer <= 0) ? input.move : 0;
  f.vx += f.moveDir * effAccel(f);

  // 跳跃：地面跳 + 奶蛙二段跳
  if (input.jump && !f.crouching && !attacking && f.chainTimer <= 0) {
    if (f.onGround) {
      f.vy = BASE_JUMP * f.stats.jumpMult;
      f.onGround = false;
      f.jumpsUsed = 1;
    } else if (f.stats.trait === 'doubleJump' && f.jumpsUsed < 2 && f.jumpCd <= 0) {
      f.vy = BASE_JUMP * f.stats.jumpMult * 0.9;
      f.jumpsUsed = 2;
      f.jumpCd = AIR_JUMP_CD;
      spawnParticle(f.x, f.y - 40, '#ffffff');
    }
  }
  if (f.onGround) f.jumpsUsed = 0;

  if (!attacking) {
    if (input.attack && f.attackCd === 0) startAttack(f, false);
    else if (input.special && f.specialCd === 0 && f.chainTimer <= 0) startAttack(f, true);
  }

  if (input.bomb && f.hasBomb && !f.dead) {
    bombs.push({ x: f.x, y: f.y - 60, timer: f.bombTimer });
    f.hasBomb = false;
    f.bombTimer = 0;
  }

  // 物理
  f.vy += GRAVITY;
  f.x += f.vx;
  f.y += f.vy;
  f.vx *= FRICTION;
  if (Math.abs(f.vx) < 0.05) f.vx = 0;
  if (f.x < MARGIN) { f.x = MARGIN; if (f.vx < 0) f.vx = 0; }
  if (f.x > MAP_W - MARGIN) { f.x = MAP_W - MARGIN; if (f.vx > 0) f.vx = 0; }
  if (f.y >= GROUND_Y) { f.y = GROUND_Y; f.vy = 0; f.onGround = true; }
  else f.onGround = false;

  // 状态标签（便于调试/展示）
  if (f.dead) f.state = 'dead';
  else if (f.hitstun > 0) f.state = 'hit';
  else if (f.atkType === 'special') f.state = 'special';
  else if (f.atkType === 'normal') f.state = 'attack';
  else if (!f.onGround) f.state = 'air';
  else if (f.crouching) f.state = 'crouch';
  else if (Math.abs(f.vx) > 0.2) f.state = 'move';
  else f.state = 'idle';
}

function updateDead(f) {
  f.deadTimer--;
  if (f.deadTimer <= 0) {
    f.dead = false;
    f.hp = f.maxHp;
    f.x = f.homeX;
    f.y = GROUND_Y;
    f.vx = 0; f.vy = 0;
    f.onGround = true;
    f.crouching = false;
    f.atkType = null;
    f.facing = f.homeFacing;
    f.invincible = RESPAWN_INVINCIBLE;
    f.graceTimer = RESPAWN_GRACE;
    f.shieldTimer = 0; f.skateTimer = 0; f.chainTimer = 0; f.powerTimer = 0; f.hasBomb = false;
    spawnRespawnParticles(f.x, GROUND_Y - 60);
  }
}

/* ================= AI（人机模式，带难度分级） ================= */
const AI_PARAMS = {
  easy:   { interval: [25, 35], atkDist: 45, spMult: 0.5, dodge: 0.15 },
  normal: { interval: [12, 20], atkDist: 65, spMult: 1.0, dodge: 0.35 },
  hard:   { interval: [6, 10],  atkDist: 80, spMult: 1.6, dodge: 0.55 },
};
let aiTimer = 0;
function updateAI() {
  const e = p2, p = p1;
  const P = AI_PARAMS[settings.aiDifficulty] || AI_PARAMS.normal;
  if (e.hitstun > 0 || e.atkType || e.dead) {
    return { move: 0, jump: false, crouch: false, attack: false, special: false, bomb: false, face: e.facing };
  }
  if (p.dead || p.graceTimer > 0) {
    return { move: 0, jump: false, crouch: false, attack: false, special: false, bomb: false, face: e.facing };
  }
  const dx = p.x - e.x;
  const dist = Math.abs(dx);
  const dir = dx > 0 ? 1 : -1;

  aiTimer--;
  if (aiTimer <= 0) {
    aiTimer = P.interval[0] + Math.floor(Math.random() * (P.interval[1] - P.interval[0] + 1));
    e.aiJumped = false;
    const r = Math.random();
    if (dist < P.atkDist) {
      if (r < 0.50) e.aiState = 'attack';
      else if (r < 0.70) e.aiState = 'jump';
      else if (r < 0.90) e.aiState = 'retreat';
      else e.aiState = 'idle';
    } else if (dist < 150) {
      if (r < 0.45) e.aiState = 'chase';
      else if (r < 0.60) e.aiState = 'idle';
      else if (r < 0.75) e.aiState = 'jump';
      else if (r < 0.90) e.aiState = 'attack';
      else e.aiState = 'retreat';
    } else if (dist < 260) {
      if (r < 0.55) e.aiState = 'chase';
      else if (r < 0.70) e.aiState = 'jump';
      else if (r < 0.85) e.aiState = 'idle';
      else e.aiState = 'retreat';
    } else {
      if (r < 0.70) e.aiState = 'chase';
      else if (r < 0.85) e.aiState = 'jump';
      else e.aiState = 'idle';
    }
  }

  let move = 0, jump = false, attack = false, special = false;

  switch (e.aiState) {
    case 'attack':
      if (dist < P.atkDist && e.attackCd === 0) attack = true;
      else if (dist > 95) move = dir;
      else if (dist < 40) move = -dir;
      break;
    case 'chase':
      if (dist > 35) move = dir;
      if (dist < P.atkDist && e.attackCd === 0) attack = true;
      break;
    case 'retreat':
      if (dist < 280) move = -dir;
      break;
    case 'jump':
      if (e.onGround && !e.aiJumped) { jump = true; e.aiJumped = true; }
      if (dist > 220) move = dir;
      break;
    case 'idle':
      if (dist > 200) move = dir;
      break;
  }

  if (!attack && e.specialCd === 0 && dist < 150 && p.invincible <= 0) {
    let chance = 0.08 * P.spMult;
    if (p.hp < p.maxHp * 0.5) chance += 0.12 * P.spMult;
    if (dist < 130) chance += 0.15 * P.spMult;
    if (dist < 70) chance += 0.10 * P.spMult;
    if (Math.random() < chance) special = true;
  }
  if (p.atkType && dist < 95 && e.onGround && Math.random() < P.dodge) {
    jump = true; attack = false; special = false;
  }
  if (p.invincible > 0 && dist < 65 && Math.random() < 0.5) attack = false;
  if (p.crouching && settings.aiDifficulty === 'hard' && attack && Math.random() < 0.6) attack = false;

  return { move: move, jump: jump, crouch: false, attack: attack, special: special, bomb: false, face: dir };
}

/* ================= 命中判定与伤害 ================= */
function resolveAttack(atk, def) {
  if (!atk.atkType || atk.hitDone || def.dead) return;
  const cfg = atk.atkType === 'normal' ? NORMAL_ATK : SPECIAL_ATK;
  const elapsed = frame - atk.atkStart;
  if (elapsed < cfg.activeStart || elapsed >= cfg.activeEnd) return;
  const ab = attackBox(atk, cfg);
  const db = bodyBox(def);
  if (overlap(ab, db)) {
    if (def.invincible > 0) return;
    atk.hitDone = true;
    let dmg = atk.atkType === 'normal' ? atk.stats.atkDmg : atk.stats.spDmg;
    if (atk.powerTimer > 0) dmg *= 2; // ⚡双倍伤害
    const hit = applyDamage(def, dmg, { attacker: atk });
    if (hit) {
      atk.combo++;
      atk.comboTimer = COMBO_WINDOW;
      matchCombo = Math.max(matchCombo, atk.combo);

/* 统一伤害入口（护盾/蹲防/无敌/木桩/死亡统一处理） */
function applyDamage(def, dmg, opts) {
  opts = opts || {};
  if (def.dead || def.hp <= 0) return false;
  if (def.invincible > 0) return false;
  if (def.shieldTimer > 0) {
    def.shieldTimer = 0;
    SFX.defend();
    spawnShieldBreak(def.x, def.y - 70);
    addDamageNumber(def.x, def.y - 100, '🛡', 'shield');
    return false;
  }
  if (def.crouching) {
    const d = Math.max(1, Math.round(dmg * 0.2));
    def.hp = Math.max(0, def.hp - d);
    SFX.defend();
    addDamageNumber(def.x + (Math.random() * 40 - 20), def.y - 95, d, 'defend');
    spawnDeflectParticles(def.x - (opts.attacker ? opts.attacker.facing : 1) * 30, def.y - 70);
    addScore(10);
  } else {
    dmg = Math.max(1, Math.round(dmg));
    def.hp = Math.max(0, def.hp - dmg);
    SFX.hit();
    addScreenFlash('hit');
    const cls = opts.attacker ? (opts.attacker.atkType === 'special' ? 'special' : 'hit') : 'bomb';
    addDamageNumber(def.x + (Math.random() * 40 - 20), def.y - 95, dmg, cls);
    spawnHitParticles(def.x - (opts.attacker ? opts.attacker.facing : 1) * 30, def.y - 75);
    addScore(10);
    // 顿帧 + 震动（打击感）
    hitstop = Math.max(hitstop, opts.attacker ? (opts.attacker.atkType === 'special' ? 4 : 2) : 4);
    shake = Math.max(shake, opts.attacker ? 0.5 : 0.8);
    if (!def.dummy) {
      def.hitstun = 12;
      def.invincible = 42;
      def.atkType = null;
    }
    const knock = opts.attacker ? opts.attacker.facing * (opts.attacker.stats.trait === 'heavyKnock' ? 2.5 : 1.5) : (opts.knock || 0);
    def.vx += knock;
  }
  if (def.hp <= 0 && !def.dummy) onDeath(def);
  else if (def.hp <= 0) { def.hp = 1; } // 木桩不死亡，保底 1 血
  return true;
}

function onDeath(f) {
  f.lives--;
  f.dead = true;
  f.deadTimer = RESPAWN_TIME;
  f.atkType = null;
  f.crouching = false;
  f.hitstun = 0;
  f.invincible = 0;
  f.vx = 0; f.vy = 0;
  f.shieldTimer = 0; f.skateTimer = 0; f.chainTimer = 0; f.powerTimer = 0; f.hasBomb = false;
  spawnDeathParticles(f.x, f.y - 70);
  addScreenFlash('hit');
  addDamageNumber(f.x, f.y - 140, '击倒！', 'banner');
  hitstop = Math.max(hitstop, 6);
  slowmo = 18; // 0.3 秒慢动作
  shake = Math.max(shake, 0.9);
  addScore(100);
  if (f.lives <= 0) checkGameOver();
}

function checkGameOver() {
  const p1Out = p1.lives <= 0;
  const p2Out = p2.lives <= 0;
  let next = null;
  if (p1Out && p2Out) next = 'draw';
  else if (p2Out) next = 'win';
  else if (p1Out) next = 'lose';
  if (next && next !== gameOver) {
    gameOver = next;
    gameOverTimer = 0;
    if (next === 'win') { SFX.win(); addScore(500); stats.wins++; }
    else if (next === 'lose') SFX.lose();
    else SFX.draw();
    if (mode !== 'train') {
      stats.games++;
      stats.maxCombo = Math.max(stats.maxCombo, matchCombo);
      stats.bestScore = Math.max(stats.bestScore, matchScore);
      stats.totalScore += matchScore;
      saveJSON('game_stats', stats);
    }
  }
}

    ctx.arc(sx, b.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(sx, b.y, 9, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawExplosions() {
  for (const ex of explosions) {
    const t = ex.life / ex.maxLife;
    const sx = w2sX(ex.x);
    const r = BOMB_RADIUS * viewport.scale * (1.3 - t * 0.3);
    ctx.fillStyle = 'rgba(255,150,40,' + (0.6 * t).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(sx, ex.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,120,' + (0.8 * t).toFixed(3) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(sx, ex.y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawCharacter(f) {
  if (f.dead) return;
  const frameName = currentFrameName(f);
  const img = images[f.folder + '/' + frameName + '.png'];
  if (f.invincible > 0 && Math.floor(f.invincible / 4) % 2 === 0) ctx.globalAlpha = 0.45;
  const sx = w2sX(f.x);
  const air = 1 - Math.max(0, Math.min(1, (GROUND_Y - f.y) / 200));
  ctx.fillStyle = 'rgba(0,0,0,' + (0.18 * air).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(sx, GROUND_Y + 3, 34 * viewport.scale, 7 * viewport.scale, 0, 0, Math.PI * 2);
  ctx.fill();
  const cw = 100 * viewport.scale;
  const ch = 125 * viewport.scale;
  const topY = f.y - 125;
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, sx - cw / 2, topY, cw, ch);
  } else {
    ctx.fillStyle = f.color;
    ctx.fillRect(sx - cw / 2, topY, cw, ch);
  }
  ctx.globalAlpha = 1;
  if (f.crouching) {
    ctx.strokeStyle = 'rgba(80,180,255,0.9)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(sx, f.y - 40, 60 * viewport.scale, 68 * viewport.scale, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (f.shieldTimer > 0) {
    ctx.fillStyle = 'rgba(255,215,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(sx, f.y - 60, 66 * viewport.scale, 78 * viewport.scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,0,0.85)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.ellipse(sx, f.y - 60, 66 * viewport.scale, 78 * viewport.scale, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (f.chainTimer > 0) {
    ctx.fillStyle = '#95a5a6';
    ctx.beginPath();
    ctx.arc(sx, f.y - 135, 10 * viewport.scale, 0, Math.PI * 2);
    ctx.fill();
  }
  if (f.hasBomb) {
    ctx.fillStyle = '#e74c3c';
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💣', sx, f.y - 138);
  }
  if (f.skateTimer > 0) {
    ctx.fillStyle = 'rgba(74,163,255,0.85)';
    ctx.fillRect(sx - 34 * viewport.scale, f.y - 6, 68 * viewport.scale, 6 * viewport.scale);
  }
  if (f.powerTimer > 0) {
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚡', sx + 44 * viewport.scale, f.y - 130);
  }
  // 连击显示
  if (f.combo > 1) {
    ctx.font = 'bold ' + (f.combo >= 5 ? 22 : 16) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = f.combo >= 5 ? '#ffd700' : '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('x' + f.combo, sx, f.y - 150);
  }
}

function drawSpecialAreas() {
  for (let i = 0; i < specialAreas.length; i++) {
    const s = specialAreas[i];
    const t = s.life / s.maxLife;
    const sx = w2sX(s.x);
    const minX = s.facing > 0 ? sx + 25 * viewport.scale : sx - 145 * viewport.scale;
    ctx.fillStyle = 'rgba(255,210,60,' + (0.4 * t).toFixed(3) + ')';
    ctx.fillRect(minX, s.y - 105, 120 * viewport.scale, 90);
    ctx.strokeStyle = 'rgba(255,240,150,' + (0.7 * t).toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.strokeRect(minX, s.y - 105, 120 * viewport.scale, 90);
  }
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(w2sX(p.x) - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawDamageNumbers() {
  ctx.textAlign = 'center';
  for (let i = 0; i < damageNumbers.length; i++) {
    const n = damageNumbers[i];
    ctx.globalAlpha = Math.max(0, n.life / n.maxLife);
    ctx.font = n.big ? 'bold 36px "Microsoft YaHei", sans-serif' : 'bold 22px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = DMG_COLORS[n.cls] || '#ff4d4d';
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.lineWidth = 4;
    ctx.strokeText(n.text, w2sX(n.x), n.y);
    ctx.fillText(n.text, w2sX(n.x), n.y);
  }
  ctx.globalAlpha = 1;
}

function drawFlashes() {
  for (let i = 0; i < flashes.length; i++) {
    const fl = flashes[i];
    const t = fl.life / fl.maxLife;
    if (fl.type === 'special') ctx.fillStyle = 'rgba(255,220,90,' + (0.5 * t).toFixed(3) + ')';
    else ctx.fillStyle = 'rgba(255,80,80,' + (0.32 * t).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* HUD（屏幕坐标，不随视口缩放） */
function drawHUD() {
  const barW = 320, barH = 20, top = 18;
  const p1Name = playerName || 'P1';
  const p2Name = mode === 'vsAI' ? '大狗' : (mode === 'train' ? '木桩' : 'P2');
  drawBar(72, top, barW, barH, p1.hp / p1.maxHp, p1.color, p1Name, p1.hp, p1.maxHp, p1);
  drawBar(W - 40 - barW, top, barW, barH, p2.hp / p2.maxHp, p2.color, p2Name, p2.hp, p2.maxHp, p2);
  drawLives(72, top + 30, p1, 'left');
  drawLives(W - 40 - barW, top + 30, p2, 'right');
  drawSpecialCd(72, top + 52, p1, 'left');
  drawSpecialCd(W - 40 - barW, top + 52, p2, 'right');
  // buff 图标 + 剩余秒数
  drawBuffs(72, top + 74, p1, 'left');
  drawBuffs(W - 40 - barW, top + 74, p2, 'right');
  // 本局得分
  ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('得分 ' + matchScore, W / 2, top + 14);
}

function drawBar(x, y, w, h, ratio, color, name, hp, maxHp, f) {
  ratio = Math.max(0, Math.min(1, ratio));
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#555';
  ctx.fillRect(x, y, w, h);
  if (ratio > 0) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * ratio, h);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x, y, w * ratio, 6);
  }
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  // 角色头像（用待机帧）
  const img = images[f.folder + '/' + frameSet(f).mv[0] + '.png'];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x - 22, y + 10, 15, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, x - 36, y - 4, 28, 28);
    ctx.restore();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x - 22, y + 10, 15, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText(name, x + 2, y - 6);
  ctx.textAlign = 'right';
  ctx.fillText(hp + ' / ' + maxHp, x + w, y - 6);
}

function drawLives(x, y, f, side) {
  ctx.font = '15px serif';
  ctx.textAlign = side === 'left' ? 'left' : 'right';
  ctx.fillStyle = f.color;
  ctx.fillText('\u2665\u00D7' + f.lives, x, y);
}

function drawSpecialCd(x, y, f, side) {
  const w = 110, h = 8;
  const ready = f.specialCd <= 0;
  const ratio = ready ? 1 : 1 - f.specialCd / f.stats.spCd;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = ready ? '#ffd700' : '#c9a227';
  ctx.fillRect(x, y, w * ratio, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = side === 'left' ? 'left' : 'right';
  const text = ready ? '大招 就绪' : '大招 ' + (f.specialCd / 60).toFixed(1) + 's';
  ctx.fillText(text, side === 'left' ? x + w + 8 : x - 8, y + 8);
}

function drawBuffs(x, y, f, side) {
  const items = [];
  if (f.shieldTimer > 0) items.push('🛡' + Math.ceil(f.shieldTimer / 60) + 's');
  if (f.chainTimer > 0) items.push('⛓' + Math.ceil(f.chainTimer / 60) + 's');
  if (f.skateTimer > 0) items.push('🛹' + Math.ceil(f.skateTimer / 60) + 's');
  if (f.powerTimer > 0) items.push('⚡' + Math.ceil(f.powerTimer / 60) + 's');
  if (f.hasBomb) items.push('💣' + Math.ceil(f.bombTimer / 60) + 's');
  if (items.length === 0) return;
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = side === 'left' ? 'left' : 'right';
  ctx.fillText(items.join('  '), side === 'left' ? x : x + 320, y + 8);
}

function drawHint() {
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.textAlign = 'center';
  ctx.fillText(mode === 'train' ? 'W 跳 · S 蹲 · J 攻 · K 大招 · M 炸弹 · ESC 暂停 · 右下角可重置木桩' : 'A/D 移动 · W 跳 · S 蹲防 · J 攻 · K 大招 · M 炸弹 · ESC 暂停', W / 2, H - 8);
}

function drawGameOver() {
  gameOverTimer++;
  const t = Math.min(1, gameOverTimer / 30);
  const scale = 0.6 + 0.4 * easeOutBack(t);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2 - 40);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.font = 'bold 54px "Microsoft YaHei", sans-serif';
  let text = '';
  if (gameOver === 'win') text = mode === 'vsAI' ? '胜 利 !' : (mode === 'train' ? '训练结束' : 'P1 胜利 !');
  else if (gameOver === 'lose') text = mode === 'vsAI' ? '失 败 !' : (mode === 'vsP2' ? 'P2 胜利 !' : '');
  else text = '平 局 !';
  ctx.fillStyle = gameOver === 'win' ? '#ffd700' : (gameOver === 'lose' ? '#ff5a5a' : '#ffffff');
  ctx.fillText(text, 0, 0);
  ctx.restore();
  // 胜方大头像
  if (gameOver === 'win' || gameOver === 'lose') {
    const winner = gameOver === 'win' ? p1 : p2;
    const img = images[winner.folder + '/' + frameSet(winner).mv[0] + '.png'];
    if (img && img.complete && img.naturalWidth > 0) {
      const bw = 90 * (0.8 + 0.2 * t);
      ctx.drawImage(img, W / 2 - bw / 2, H / 2 + 20, bw, bw * 1.25);
    }
  }
  ctx.font = '19px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText('得分 ' + matchScore + '　按 R 再来一局 · 按 M 返回主菜单', W / 2, H / 2 + 170);
}
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function draw() {
  if (screen !== 'game') return;
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake * 8, (Math.random() - 0.5) * shake * 8);
    shake *= 0.88;
    if (shake < 0.02) shake = 0;
  }
  drawBackground();
  drawPickup();
  drawBombs();
  drawExplosions();
  drawSpecialAreas();
  drawCharacter(p1);
  drawCharacter(p2);
  drawParticles();
  drawDamageNumbers();
  ctx.restore();
  drawFlashes();
  drawHUD();
  drawHint();
  if (gameOver) drawGameOver();
  if (imagesLeft > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('加载中…', W / 2, H / 2);
  }
}

/* ================= 启动 ================= */
if (playerName) showScreen('menuScreen');
else showScreen('loginScreen');
requestAnimationFrame(loop);
</script>
</body>
</html>
